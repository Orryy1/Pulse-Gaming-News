name: Pulse release gate

on:
  pull_request:
    branches:
      - main
      - release/pulse-v1
  push:
    branches:
      - release/pulse-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install the media probe runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install from package-lock.json
        run: npm ci

      - name: Install the pinned Evercold HyperFrames material project
        run: npm --prefix videos/evercold-bastion-short ci

      - name: Acquire exact ephemeral Evercold source media
        run: >-
          npm run ops:governed-source-media-ephemeral --
          acquire
          --mode LOCAL_PROOF
          --manifest videos/evercold-bastion-short/source-media-manifest.json
          --manifest-sha256 05d1657249776f87f3f6f91a4b8b8a36575eaac0c527ba8cde8ef5b5855e96b8
          --story-id official_d86953ca92ca

      - name: Validate ephemeral bytes and governed rights evidence
        run: >-
          npm run ops:governed-source-media-ephemeral --
          validate
          --mode LOCAL_PROOF
          --manifest videos/evercold-bastion-short/source-media-manifest.json
          --manifest-sha256 05d1657249776f87f3f6f91a4b8b8a36575eaac0c527ba8cde8ef5b5855e96b8
          --story-id official_d86953ca92ca

      - name: Strictly check the Evercold HyperFrames material project
        run: npm --prefix videos/evercold-bastion-short run check -- --strict

      - name: Prove release configuration and evidence controls
        run: >-
          node --test
          tests/services/stabilisation-runtime-config.test.js
          tests/services/stabilisation-dotenv-precedence.test.js
          tests/services/dotenv-before-db.test.js
          tests/services/runtime-build-info.test.js
          tests/services/health-public-metadata.test.js
          tests/services/report-governance.test.js
          tests/services/stabilisation-runtime-provenance-cli.test.js
          tests/services/ci-secret-scan.test.js
          tests/services/pulse-release-ci.test.js
          tests/services/agent-operating-rules.test.js
          tests/ops/agent-operator-command-contract.test.js
          tests/services/governed-story-intake.test.js
          tests/ops/governed-story-intake-cli.test.js
          tests/services/governed-worker-containment.test.js
          tests/ops/governed-worker-containment-cli.test.js
          tests/services/sqlite-restore-rehearsal.test.js
          tests/ops/sqlite-restore-rehearsal-cli.test.js
          tests/services/governed-owned-motion.test.js
          tests/ops/governed-owned-motion-cli.test.js
          tests/services/governed-source-media.test.js
          tests/services/governed-source-media-actual-manifest.test.js
          tests/services/governed-source-media-ephemeral.test.js
          tests/ops/governed-source-media-ephemeral-cli.test.js
          tests/services/governed-narration-materialize.test.js
          tests/ops/governed-narration-materialize-cli.test.js
          tests/services/governed-final-composite.test.js
          tests/ops/governed-final-composite-cli.test.js
          tests/services/governed-publication-evidence-package.test.js
          tests/ops/governed-publication-evidence-package-cli.test.js
          tests/services/governed-publication-metadata.test.js
          tests/services/governed-publication-review.test.js
          tests/ops/governed-publication-review-cli.test.js
          tests/services/governed-platform-dispatch.test.js
          tests/services/guarded-youtube-window.test.js
          tests/ops/guarded-youtube-window-cli.test.js
          tests/services/platform-safe-zones.test.js
          tests/services/evercold-hyperframes-material.test.js
          tests/services/evercold-platform-safe-zone-runtime.test.js

      - name: Validate repository operating rules
        run: npm run ops:agent-rules

      - name: Scan candidate source without exposing matched values
        run: node tools/ci-secret-scan.js

      - name: Run the full Node test suite
        run: npm test

      - name: Build the dashboard
        run: npm run build
