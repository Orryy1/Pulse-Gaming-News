name: Pulse release gate

on:
  pull_request:
    branches:
      - main
      - release/pulse-v1
  push:
    branches:
      - release/pulse-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.17.1
          cache: npm

      - name: Install the media probe runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install from package-lock.json
        run: npm ci

      - name: Install the pinned Evercold HyperFrames material project
        run: npm --prefix videos/evercold-bastion-short ci

      - name: Acquire exact ephemeral Evercold source media
        run: >-
          npm run ops:governed-source-media-ephemeral --
          acquire
          --mode LOCAL_PROOF
          --manifest videos/evercold-bastion-short/source-media-manifest.json
          --manifest-sha256 f07fa4838d8f0d46e88c35759286760cd83aafb6031f141f7bf8e2dfdf68dc4b
          --story-id official_d86953ca92ca

      - name: Validate ephemeral bytes and governed rights evidence
        run: >-
          npm run ops:governed-source-media-ephemeral --
          validate
          --mode LOCAL_PROOF
          --manifest videos/evercold-bastion-short/source-media-manifest.json
          --manifest-sha256 f07fa4838d8f0d46e88c35759286760cd83aafb6031f141f7bf8e2dfdf68dc4b
          --story-id official_d86953ca92ca

      - name: Strictly check the Evercold HyperFrames material project
        run: npm --prefix videos/evercold-bastion-short run check -- --strict

      - name: Prove release configuration and evidence controls
        run: >-
          node --test
          tests/services/stabilisation-runtime-config.test.js
          tests/services/governed-editorial-client.test.js
          tests/services/breaking-source-adapters.test.js
          tests/services/breaking-source-hardening.test.js
          tests/services/governed-editorial-evidence-ingress.test.js
          tests/services/governed-editorial-evidence-handler.test.js
          tests/services/governed-fast-news-lane-decision.test.js
