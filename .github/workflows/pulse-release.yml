name: Pulse release gate

on:
  pull_request:
    branches:
      - main
      - release/pulse-v1
  push:
    branches:
      - main
      - release/pulse-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install from package-lock.json
        run: npm ci

      - name: Prove release-governance controls
        run: node --test tests/services/report-governance.test.js tests/services/ci-secret-scan.test.js tests/services/stabilisation-evidence.test.js tests/services/pulse-release-ci.test.js

      - name: Validate repository operating rules
        run: npm run ops:agent-rules

      - name: Scan candidate source without exposing matched values
        run: node tools/ci-secret-scan.js

      - name: Run the full Node test suite
        run: npm test

      - name: Build the dashboard
        run: npm run build
