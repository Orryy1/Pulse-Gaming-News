<script id="env:84888700-e8e9-11f1-ad7c-fbe37df89106" type="application/json">{"cache":{"Product:UP9000-PPSA03016_00-MARVELSPIDERMAN2":{"id":"UP9000-PPSA03016_00-MARVELSPIDERMAN2","__typename":"Product","concept":{"__ref":"Concept:10002456"},"edition":{"__typename":"ProductEdition","name":"Standard Edition"},"name":"Marvel’s Spider-Man 2","descriptions":[{"__typename":"Description","type":"SHORT","value":"Be Greater. Together."},{"__typename":"Description","type":"LEGAL","value":"The standard price of this product is $69.99"},{"__typename":"Description","type":"LONG","value":"Edition includes:<br/>Marvel’s Spider-Man 2 full game for PS5®.<br/><br/>Spider-Men Peter Parker and Miles Morales face the ultimate test of strength inside and outside the mask as they fight to save the city, each other and the ones they love, from the monstrous Venom and the dangerous new symbiote threat.<br/><br/>Explore an expansive Marvel’s New York with faster web-swinging and the all-new Web Wings, quickly switching between Peter and Miles  to experience different stories, epic new abilities and high-tech gear.<br/><br/>Wield Peter’s symbiote abilities and Miles’ explosive bio-electric powers in battle against new and iconic Marvel Super Villains – including an original take on a symbiote-infused Venom, the ruthless Kraven the Hunter, the volatile Lizard, and more from the Marvel Rogues’ Gallery.<br/><br/>Feel the true power of Spider-Man in your hands!<br/>- Haptic feedback: experience the full force of Peter’s and Miles’ new abilities at your fingertips with responsive vibrations.<br/>- Adaptive triggers: master acrobatic moves, execute thrilling combos, and discover the breathtaking excitement of web-swinging traversal.<br/><br/>Live the Super-Hero life!<br/>- Tempest 3D AudioTech: pinpoint the sounds of webs, bio-electric powers, bustling traffic, responsive New Yorkers, and dangerous enemy attacks.*<br/>- Stunning visuals: explore beautifully vibrant new environments and locations, including Brooklyn and Queens – as well as locations like Coney Island.<br/><br/>*3D Audio via built-in TV speakers or analogue/USB stereo headphones.<br/>"},{"__typename":"Description","type":"COMPATIBILITY_NOTICE","value":"Vibration function and trigger effect supported (DualSense wireless controller)<br/>1 players<br/>PS5 Pro Enhanced"},{"__typename":"Description","type":"LEGAL","value":"<br><br>Online features require an account for PlayStation and are subject to terms of service and applicable privacy policy (playstation.com/Terms and playstation.com/legal/privacy-policy). <br><br>Software subject to license (us.playstation.com/softwarelicense). <br>"},{"__typename":"Description","type":"LEGAL","value":"<br>You can download and play this content on the main PS5 console associated with your account (through the “Console Sharing and Offline Play” setting) and on any other PS5 consoles when you login with your same account.<br>"},{"__typename":"Description","type":"LEGAL","value":"<br/>©2024 MARVEL.<br/>©2024 Sony Interactive Entertainment LLC. Developed by Insomniac Games, Inc.<br/>"}],"platforms":["PS5"],"publisherName":"Sony Interactive Entertainment","releaseDate":"2023-10-20T04:00:00Z","starRating":{"__typename":"StarRating","averageRating":4.71,"totalRatingsCount":271738},"storeDisplayClassification":"FULL_GAME","compatibilityNoticesByPlatform":{"__typename":"CompatibilityNotices","PS5":[{"__typename":"CompatibilityNotice","type":"PS5_VIBRATION","value":"OPTIONAL"},{"__typename":"CompatibilityNotice","type":"PS5_TRIGGER_EFFECT","value":"OPTIONAL"},{"__typename":"CompatibilityNotice","type":"GAME_HELP_SUPPORTED","value":"true"},{"__typename":"CompatibilityNotice","type":"GRAPHICS_ENHANCED","value":"true"}],"PS4":null},"topCategory":"GAME","webctas":[{"__ref":"GameCTA:UPSELL_PS_PLUS_GAME_CATALOG:ADD_TO_CART:UP9000-PPSA03016_00-MARVELSPIDERMAN2-U002:SUB001-SUBC00002_00-7CMQKDWFK0KWV63Z"},{"__ref":"GameCTA:ADD_TO_CART:ADD_TO_CART:UP9000-PPSA03016_00-MARVELSPIDER iptions":[{"__typename":"Description","type":"SHORT","subType":"NONE","value":"Be Greater. Together."},{"__typename":"Description","type":"LEGAL","subType":null,"value":"The standard price of this product is $69.99"},{"__typename":"Description","type":"LONG","subType":"NONE","value":"Edition includes:<br/>Marvel’s Spider-Man 2 full game for PS5®.<br/><br/>Spider-Men Peter Parker and Miles Morales face the ultimate test of strength inside and outside the mask as they fight to save the city, each other and the ones they love, from the monstrous Venom and the dangerous new symbiote threat.<br/><br/>Explore an expansive Marvel’s New York with faster web-swinging and the all-new Web Wings, quickly switching between Peter and Miles  to experience different stories, epic new abilities and high-tech gear.<br/><br/>Wield Peter’s symbiote abilities and Miles’ explosive bio-electric powers in battle against new and iconic Marvel Super Villains – including an original take on a symbiote-infused Venom, the ruthless Kraven the Hunter, the volatile Lizard, and more from the Marvel Rogues’ Gallery.<br/><br/>Feel the true power of Spider-Man in your hands!<br/>- Haptic feedback: experience the full force of Peter’s and Miles’ new abilities at your fingertips with responsive vibrations.<br/>- Adaptive triggers: master acrobatic moves, execute thrilling combos, and discover the breathtaking excitement of web-swinging traversal.<br/><br/>Live the Super-Hero life!<br/>- Tempest 3D AudioTech: pinpoint the sounds of webs, bio-electric powers, bustling traffic, responsive New Yorkers, and dangerous enemy attacks.*<br/>- Stunning visuals: explore beautifully vibrant new environments and locations, including Brooklyn and Queens – as well as locations like Coney Island.<br/><br/>*3D Audio via built-in TV speakers or analogue/USB stereo headphones.<br/>"},{"__typename":"Description","type":"COMPATIBILITY_NOTICE","subType":"NONE","value":"Vibration function and trigger effect supported (DualSen
