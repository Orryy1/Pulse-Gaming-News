          <path id="02-binary-edge-guide-1" d="M 0 960 L 120 840"></path>
          <path id="02-binary-edge-guide-2" d="M 120 840 L 360 600"></path>
          <path id="02-binary-edge-guide-3" d="M 360 600 L 600 360"></path>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-binary-edge"] = timeline;

      const chrome = document.querySelector('[data-node="02-binary-edge-chrome"]');
      const cells = Array.from(document.querySelectorAll('[data-node="02-binary-edge-cell"]'));
      const guidePaths = Array.from(document.querySelectorAll('[data-node="02-binary-edge-guide"] path'));
      const stairPaths = Array.from(document.querySelectorAll('[data-node="02-binary-edge-stair"] path'));

      [...guidePaths, ...stairPaths].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      timeline.fromTo(
        chrome,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0
      );

      const guideStarts = [0.18, 0.64, 1.10, 1.56];
      guidePaths.forEach((path, index) => {
        timeline.to(
          path,
          { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
          guideStarts[index]
        );
      });

      const binaryStates = [
        { t: 0.00, key: "----", values: ["", "", "", ""] },
        { t: 0.35, key: "F---", values: ["FULL", "", "", ""] },
        { t: 0.92, key: "FE--", values: ["FULL", "EMPTY", "", ""] },
        { t: 1.55, key: "FEF-", values: ["FULL", "EMPTY", "FULL", ""] },
        { t: 2.25, key: "FEFE", values: ["FULL", "EMPTY", "FULL", "EMPTY"] }
      ];

      const stateAt = (time) => {
        for (let index = binaryStates.length - 1; index >= 0; index -= 1) {
          if (time >= binaryStates[index].t) return binaryStates[index];
        }
        return binaryStates[0];
      };

      let lastStateKey = "";
      const applyBinaryState = (state) => {
        if (state.key === lastStateKey) return;
        cells.forEach((cell, index) => {
          const value = state.values[index];
          const isFull = value === "FULL";
          const fill = cell.querySelector('[data-node="02-binary-edge-cell-fill"]');
          const label = cell.querySelector('[data-node="02-binary-edge-cell-label"]');
          const sample = cell.querySelector('[data-node="02-binary-edge-cell-index"]');

          label.textContent = value;
          fill.style.opacity = isFull ? "1" : "0";
          label.style.color = isFull ? "#0d0d0f" : "#f0f0f0";
          sample.style.color = isFull ? "rgba(17,17,17,0.55)" : "#504b48";
          cell.style.borderColor = value ? "#ff6b1a" : "#504b48";
        });
        lastStateKey = state.key;
      };

      applyBinaryState(binaryStates[0]);
      const binaryDriver = { t: 0 };
      timeline.to(
        binaryDriver,
        {
          t: 3.1,
          duration: 3.1,
          ease: "none",
          onUpdate: () => applyBinaryState(stateAt(binaryDriver.t))
        },
        2.7
      );

      const stairStarts = [3.18, 3.77, 4.42, 5.10];
      stairPaths.forEach((path, index) => {
        timeline.to(
          path,
          { strokeDashoffset: 0, duration: index === 3 ? 0.42 : 0.54, ease: "power2.out" },
          stairStarts[index]
        );
      });

      const titleWords = [
        { node: document.querySelector('[data-word="binary"]'), text: "binary" },
        { node: document.querySelector('[data-word="edge"]'), text: "edge" }
      ];
      const baseDuration = 0.32;
      const secondsPerCharacter = 0.028;
      let cumulative = 0;
      const titleSequence = titleWords.map((entry) => {
        const duration = baseDuration + entry.text.length * secondsPerCharacter;
        const start = cumulative;
        cumulative += duration * 0.72;
        return { ...entry, start, duration };
      });

      titleSequence.forEach((entry) => {
        timeline.fromTo(
          entry.node,
          { opacity: 0, x: 54 },
          { opacity: 1, x: 0, duration: entry.duration, ease: "power3.out" },
          5.8 + entry.start
        );
      });

      timeline.fromTo(
        '[data-node="02-binary-edge-title-rule"]',
        { opacity: 0, scaleX: 0, transformOrigin: "left center" },
        { opacity: 1, scaleX: 1, duration: 0.36, ease: "power3.out" },
        6.66
      );
      timeline.fromTo(
        '[data-node="02-binary-edge-title-meta"]',
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.82
      );
    })();
  </script>
