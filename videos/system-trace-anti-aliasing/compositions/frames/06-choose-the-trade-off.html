  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["06-choose-the-trade-off"] = timeline;

      const board = document.querySelector('[data-node="06-choose-the-trade-off-board"]');
      const finalCard = document.querySelector('[data-node="06-choose-the-trade-off-final"]');
      const rows = Array.from(document.querySelectorAll('[data-node="06-choose-the-trade-off-row"]'));
      const keywords = Array.from(document.querySelectorAll('[data-node="06-choose-the-trade-off-keyword"]'));

      const waterfall = [
        { row: rows[0], start: 0.18, offset: 80, duration: 0.20 },
        { row: rows[1], start: 0.36, offset: 52, duration: 0.15 },
        { row: rows[2], start: 0.49, offset: 44, duration: 0.13 }
      ];

      waterfall.forEach((entry) => {
        timeline.set(entry.row, { opacity: 1, y: entry.offset }, entry.start);
        timeline.to(
          entry.row,
          { y: 0, duration: entry.duration, ease: "power4.out" },
          entry.start
        );
      });

      const compromiseStates = [
        { t: 0.00, key: "---", values: ["", "", ""] },
        { t: 0.32, key: "C--", values: ["COST", "", ""] },
        { t: 1.18, key: "CS-", values: ["COST", "SOFTNESS", ""] },
        { t: 2.08, key: "CSH", values: ["COST", "SOFTNESS", "HISTORY ARTEFACTS"] }
      ];

      const compromiseAt = (time) => {
        for (let index = compromiseStates.length - 1; index >= 0; index -= 1) {
          if (time >= compromiseStates[index].t) return compromiseStates[index];
        }
        return compromiseStates[0];
      };

      let lastCompromiseKey = "";
      const applyCompromiseState = (state) => {
        if (state.key === lastCompromiseKey) return;
        keywords.forEach((keyword, index) => {
          keyword.textContent = state.values[index];
        });
        lastCompromiseKey = state.key;
      };

      applyCompromiseState(compromiseStates[0]);
      const compromiseDriver = { t: 0 };
      timeline.to(
        compromiseDriver,
        {
          t: 3.1,
          duration: 3.1,
          ease: "none",
          onUpdate: () => applyCompromiseState(compromiseAt(compromiseDriver.t))
        },
        2.9
      );

      const keywordTimings = {
        cost: { start: 0.32, end: 0.66 },
        softness: { start: 1.18, end: 1.62 },
        history: { start: 2.08, end: 2.74 }
      };
      const attackDuration = 0.14;
      const releaseDuration = 0.35;
      const restLevel = 0.08;
      const envelope = (time, start, end) => {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attackDuration, 1);
        const releaseEnd = end + releaseDuration;
        if (time < releaseEnd) {
          return 1 - ((time - end) / releaseDuration) * (1 - restLevel);
        }
        return restLevel;
      };

      const glowDriver = { t: 0 };
      timeline.to(
        glowDriver,
        {
          t: 3.1,
          duration: 3.1,
          ease: "none",
          onUpdate: () => {
            keywords.forEach((keyword) => {
              const timing = keywordTimings[keyword.dataset.keyword];
              const level = envelope(glowDriver.t, timing.start, timing.end);
              keyword.style.textShadow = `0 0 ${24 * level}px rgba(255,107,26,${0.65 * level})`;
              keyword.style.transform = `scale(${1 + 0.09 * level})`;
            });
          }
        },
        2.9
      );

      timeline.to(
        board,
        { scale: 0.76, opacity: 0, duration: 0.42, ease: "power2.in" },
        6.0
      );
      timeline.fromTo(
        finalCard,
        { scale: 0.76, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.58, ease: "back.out(1.4)" },
        6.24
      );
      timeline.fromTo(
        '[data-node="06-choose-the-trade-off-final-kicker"]',
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        6.72
      );
      timeline.fromTo(
        '[data-word="choose"]',
        { opacity: 0, y: 44 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        6.82
      );
      timeline.fromTo(
        '[data-word="trade-off"]',
        { opacity: 0, y: 54 },
        { opacity: 1, y: 0, duration: 0.56, ease: "power3.out" },
        6.94
      );
      timeline.fromTo(
        '[data-node="06-choose-the-trade-off-final-note"]',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        7.12
      );
    })();
  </script>
