  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-inserted-image"] = timeline;

      const engineRail = document.querySelector('[data-node="01-inserted-image-engine-rail"]');
      const displayRail = document.querySelector('[data-node="01-inserted-image-display-rail"]');
      const engineCards = Array.from(document.querySelectorAll('[data-node="01-inserted-image-engine-card"]'));
      const morphCard = document.querySelector('[data-node="01-inserted-image-morph-card"]');
      const morphOld = document.querySelector('[data-node="01-inserted-image-morph-old"]');
      const morphNew = document.querySelector('[data-node="01-inserted-image-morph-new"]');

      const waterfall = [
        { card: engineCards[0], start: 0.18, offset: 80, duration: 0.20 },
        { card: engineCards[1], start: 0.36, offset: 52, duration: 0.15 }
      ];

      waterfall.forEach((entry) => {
        timeline.set(entry.card, { opacity: 1, y: entry.offset }, entry.start);
        timeline.to(
          entry.card,
          { y: 0, duration: entry.duration, ease: "power4.out" },
          entry.start
        );
      });

      timeline.fromTo(
        displayRail.querySelector('[data-node="01-inserted-image-rail-label"]'),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        3.0
      );
      timeline.fromTo(
        displayRail.querySelector('[data-node="01-inserted-image-rail-line"]'),
        { opacity: 0, scaleX: 0, transformOrigin: "center center" },
        { opacity: 1, scaleX: 1, duration: 0.46, ease: "power2.out" },
        3.0
      );
      timeline.fromTo(
        morphCard,
        { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 0.55, duration: 0.35, ease: "power2.out" },
        3.0
      );

      timeline.to(
        morphCard,
        {
          scale: 1.46,
          borderRadius: 0,
          backgroundColor: "#ff6b1a",
          duration: 1.0,
          ease: "power2.inOut"
        },
        3.6
      );
      timeline.to(
        morphOld,
        { opacity: 0, duration: 0.4, ease: "power1.in" },
        3.6
      );
      timeline.to(
        morphNew,
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        4.2
      );

      const titleContent = [
        { node: document.querySelector('[data-word="inserted"]'), text: "inserted" },
        { node: document.querySelector('[data-word="for"]'), text: "for" },
        { node: document.querySelector('[data-word="display"]'), text: "display" }
      ];
      const baseDuration = 0.28;
      const secondsPerCharacter = 0.025;
      let cumulative = 0;
      const titleSequence = titleContent.map((entry) => {
        const duration = baseDuration + entry.text.length * secondsPerCharacter;
        const start = cumulative;
        cumulative += duration * 0.72;
        return { ...entry, start, duration };
      });

      titleSequence.forEach((entry) => {
        timeline.fromTo(
          entry.node,
          { opacity: 0, x: 54 },
          { opacity: 1, x: 0, duration: entry.duration, ease: "power3.out" },
          6.2 + entry.start
        );
      });

      timeline.to(engineRail, { y: -12, duration: 0.65, ease: "power3.out" }, 6.2);
      timeline.to(displayRail, { y: -8, duration: 0.65, ease: "power3.out" }, 6.24);
      timeline.fromTo(
        '[data-node="01-inserted-image-title-rule"]',
        { opacity: 0, scaleX: 0, transformOrigin: "left center" },
        { opacity: 1, scaleX: 1, duration: 0.36, ease: "power3.out" },
        7.18
      );
      timeline.fromTo(
        '[data-node="01-inserted-image-title-meta"]',
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        7.30
      );
    })();
