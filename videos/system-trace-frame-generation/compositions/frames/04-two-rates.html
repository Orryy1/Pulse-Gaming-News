  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-two-rates"] = timeline;

      const simulationCards = Array.from(document.querySelectorAll('[data-node="04-two-rates-simulation-card"]'));
      const inputPulses = Array.from(document.querySelectorAll('[data-node="04-two-rates-input-pulse"]'));
      const displayCards = Array.from(document.querySelectorAll('[data-node="04-two-rates-display-card"]'));
      const morphCard = document.querySelector('[data-node="04-two-rates-morph-card"]');
      const morphOld = document.querySelector('[data-node="04-two-rates-morph-old"]');
      const morphNew = document.querySelector('[data-node="04-two-rates-morph-new"]');
      const midTick = document.querySelector('[data-node="04-two-rates-mid-tick"]');
      const statement = document.querySelector('[data-node="04-two-rates-statement"]');
      const displayStatement = document.querySelector('[data-line="display"]');
      const simulationStatement = document.querySelector('[data-line="simulation"]');

      const simulationContent = [
        { key: "a", body: "ENGINE STEP", card: simulationCards[0], pulse: inputPulses[0], hold: 0.25 },
        { key: "b", body: "ENGINE STEP", card: simulationCards[1], pulse: inputPulses[1], hold: 0.25 }
      ];
      const simulationBaseDuration = 0.54;
      const simulationSecondsPerCharacter = 0.018;
      let simulationCumulative = 0;
      const simulationSequence = simulationContent.map((entry) => {
        const duration = simulationBaseDuration + entry.body.length * simulationSecondsPerCharacter + entry.hold;
        const start = simulationCumulative;
        simulationCumulative += duration;
        return { ...entry, start, end: simulationCumulative };
      });

      const simulationAt = (time) => {
        for (let index = simulationSequence.length - 1; index >= 0; index -= 1) {
          if (time >= simulationSequence[index].start) return simulationSequence[index];
        }
        return simulationSequence[0];
      };

      simulationSequence.forEach((entry) => {
        timeline.fromTo(
          entry.card,
          { opacity: 0, y: 52 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          0.18 + entry.start
        );
        timeline.fromTo(
          entry.pulse,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" },
          0.18 + entry.start
        );
      });

      let lastSimulationKey = "";
      const simulationDriver = { t: 0 };
      timeline.to(
        simulationDriver,
        {
          t: simulationCumulative,
          duration: simulationCumulative,
          ease: "none",
          onUpdate: () => {
            const entry = simulationAt(simulationDriver.t);
            if (entry.key === lastSimulationKey) return;
            simulationCards.forEach((card) => card.removeAttribute("data-active"));
            entry.card.setAttribute("data-active", "true");
            lastSimulationKey = entry.key;
          }
        },
        0.18
      );

      displayCards.forEach((card) => {
        timeline.to(card, { opacity: 1, duration: 0.42, ease: "power2.out" }, 2.8);
      });
      timeline.fromTo(
        morphCard,
        { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 0.55, duration: 0.32, ease: "power2.out" },
        2.8
      );
      timeline.to(
        morphCard,
        {
          scale: 1.6,
          borderRadius: 0,
          backgroundColor: "#ff6b1a",
          duration: 1.0,
          ease: "power2.inOut"
        },
        3.45
      );
      timeline.to(morphOld, { opacity: 0, duration: 0.4, ease: "power1.in" }, 3.45);
      timeline.to(morphNew, { opacity: 1, duration: 0.4, ease: "power1.out" }, 4.05);
      timeline.fromTo(
        midTick,
        { opacity: 0, scaleY: 0, transformOrigin: "center top" },
        { opacity: 1, scaleY: 1, duration: 0.36, ease: "power3.out" },
        4.28
      );

      const statementStates = [
        { t: 0.00, key: "--", display: "", simulation: "" },
        { t: 0.12, key: "d-", display: "DISPLAY", simulation: "" },
        { t: 0.38, key: "dr-", display: "DISPLAY RATE", simulation: "" },
        { t: 0.66, key: "drr-", display: "DISPLAY RATE RISES", simulation: "" },
        { t: 0.94, key: "drrs", display: "DISPLAY RATE RISES", simulation: "SIMULATION" },
        { t: 1.18, key: "drrsr", display: "DISPLAY RATE RISES", simulation: "SIMULATION RATE" },
        { t: 1.42, key: "drrsrh", display: "DISPLAY RATE RISES", simulation: "SIMULATION RATE HOLDS" }
      ];

      const statementAt = (time) => {
        for (let index = statementStates.length - 1; index >= 0; index -= 1) {
          if (time >= statementStates[index].t) return statementStates[index];
        }
        return statementStates[0];
      };

      let lastStatementKey = "";
      const applyStatement = (state) => {
        if (state.key === lastStatementKey) return;
        displayStatement.textContent = state.display;
        simulationStatement.textContent = state.simulation;
        lastStatementKey = state.key;
      };

      applyStatement(statementStates[0]);
      timeline.fromTo(
        statement,
        { opacity: 0, y: 32 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.9
      );
      const statementDriver = { t: 0 };
      timeline.to(
        statementDriver,
        {
          t: 1.6,
          duration: 1.6,
          ease: "none",
          onUpdate: () => applyStatement(statementAt(statementDriver.t))
        },
        5.9
      );
    })();
  </script>
