  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-counter-lies"]');
      const scanlines = document.getElementById("01-counter-lies-scanlines");
      const topRail = document.getElementById("01-counter-lies-top-rail");
      const hero = document.getElementById("01-counter-lies-hero");
      const numberEl = document.getElementById("01-counter-lies-number");
      const unitEl = document.getElementById("01-counter-lies-unit");
      const heroRule = document.getElementById("01-counter-lies-hero-rule");
      const tokenEl = document.getElementById("01-counter-lies-token");
      const baseline = document.getElementById("01-counter-lies-baseline");
      const warmGhost = document.getElementById("01-counter-lies-baseline-warm");
      const coolGhost = document.getElementById("01-counter-lies-baseline-cool");
      const gapMarker = document.getElementById("01-counter-lies-gap-marker");
      const arrivalTicks = Array.from(root.querySelectorAll("[data-arrival-tick]"));

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-counter-lies"] = tl;

      const baselineLength = baseline.getTotalLength();
      [baseline, warmGhost, coolGhost].forEach((path) => {
        path.style.strokeDasharray = `${baselineLength}`;
        path.style.strokeDashoffset = `${baselineLength}`;
      });

      arrivalTicks.forEach((tick) => {
        const length = tick.getTotalLength();
        tick.style.strokeDasharray = `${length}`;
        tick.style.strokeDashoffset = `${length}`;
      });

      tl.fromTo(topRail, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.04);
      tl.fromTo(hero, { opacity: 0, y: 42, scale: 1.055 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "power4.out" }, 0.12);
      tl.fromTo(unitEl, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.75);
      tl.fromTo(heroRule, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 1.24);
      tl.fromTo(scanlines, { y: 0 }, { y: 32, duration: 7.552, ease: "none" }, 0);

      const HERO_CONTENT = [
        { key: "first-digit", title: "6", body: "", hold: 0.13 },
        { key: "full-number", title: "60", body: "", hold: 0.14 },
        { key: "unit", title: "60", body: "fps", hold: 0.2 },
      ];
      const HERO_BASE_DURATION = 0.18;
      const HERO_SEC_PER_CHAR = 0.02;
      let heroCumulative = 0.12;
      const HERO_TIMELINE = HERO_CONTENT.map((entry) => {
        const duration = HERO_BASE_DURATION + (entry.title.length + entry.body.length) * HERO_SEC_PER_CHAR + entry.hold;
        const start = heroCumulative;
        heroCumulative += duration;
        return { ...entry, start, end: heroCumulative };
      });

      const heroEntryAt = (time) => {
        for (let index = HERO_TIMELINE.length - 1; index >= 0; index -= 1) {
          if (time >= HERO_TIMELINE[index].start) return HERO_TIMELINE[index];
        }
        return HERO_TIMELINE[0];
      };

      const heroDriver = { t: 0 };
      let lastHeroKey = "";
      tl.to(heroDriver, {
        t: heroCumulative,
        duration: heroCumulative,
        ease: "none",
        onUpdate: () => {
          const entry = heroEntryAt(heroDriver.t);
          if (entry.key !== lastHeroKey) {
            numberEl.textContent = entry.title;
            unitEl.textContent = entry.body;
            lastHeroKey = entry.key;
          }
        },
      }, 0);

      tl.to(baseline, { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" }, 1.86);
      tl.set([warmGhost, coolGhost], { strokeDashoffset: 0 }, 2.62);

      const glitchHash = (value) => {
        const hash = Math.sin(value * 127.1 + 311.7) * 43758.5453;
        return hash - Math.floor(hash);
      };
      const glitchCopies = [warmGhost, coolGhost];
      const glitchAmplitude = { value: 0 };
      const GLITCH_START = 2.66;
      const GLITCH_DURATION = 0.38;
      const JITTER_STEP = 1 / 24;
      const MAX_SPLIT = 12;

      tl.set(glitchAmplitude, { value: 1 }, GLITCH_START);
      tl.set(glitchCopies, { opacity: 0.72 }, GLITCH_START);
      tl.to(glitchAmplitude, {
        value: 0,
        duration: GLITCH_DURATION,
        ease: "power3.in",
        onUpdate: () => {
          const step = Math.floor(tl.time() / JITTER_STEP);
          glitchCopies.forEach((copy, layer) => {
            const x = (glitchHash(step * 13 + layer * 7) * 2 - 1) * MAX_SPLIT * glitchAmplitude.value;
            const y = (glitchHash(step * 29 + layer * 11) * 2 - 1) * MAX_SPLIT * 0.35 * glitchAmplitude.value;
            gsap.set(copy, { x, y });
          });
        },
      }, GLITCH_START);
      tl.set(glitchCopies, { x: 0, y: 0, opacity: 0 }, GLITCH_START + GLITCH_DURATION);

      const TOKEN_SEQUENCE = [
        { t: 0, text: "" },
        { t: 3.04, text: "stutter?" },
      ];
      const tokenAt = (time) => {
        for (let index = TOKEN_SEQUENCE.length - 1; index >= 0; index -= 1) {
          if (time >= TOKEN_SEQUENCE[index].t) return TOKEN_SEQUENCE[index].text;
        }
        return "";
      };
      const tokenDriver = { t: 0 };
      let lastToken = "";
      tl.to(tokenDriver, {
        t: 7.552,
        duration: 7.552,
        ease: "none",
        onUpdate: () => {
          const nextToken = tokenAt(tokenDriver.t);
          if (nextToken !== lastToken) {
            tokenEl.textContent = nextToken;
            lastToken = nextToken;
          }
        },
      }, 0);

      const tickStarts = [4.95, 5.17, 5.39, 5.61, 5.83, 6.02, 6.18, 6.34, 6.48];
      arrivalTicks.forEach((tick, index) => {
        tl.to(tick, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, tickStarts[index]);
      });

      tl.fromTo(
        gapMarker,
        { opacity: 0, scale: 0, rotation: -8 },
        { opacity: 1, scale: 1, rotation: -3, duration: 0.56, ease: "power2.out" },
        6.28,
      );
    })();
  </script>
