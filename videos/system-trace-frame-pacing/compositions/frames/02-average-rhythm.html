  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const evenMarks = document.getElementById("02-average-rhythm-even-marks");
      const unevenClusters = document.querySelectorAll("[data-02-average-rhythm-cluster]");

      for (let index = 0; index < 60; index += 1) {
        evenMarks.appendChild(document.createElement("span"));
      }

      unevenClusters.forEach((cluster) => {
        for (let index = 0; index < 10; index += 1) {
          cluster.appendChild(document.createElement("span"));
        }
      });

      const titleWrap = document.getElementById("02-average-rhythm-title-wrap");
      const title = document.getElementById("02-average-rhythm-title");
      const rulerLine = document.getElementById("02-average-rhythm-ruler-line");
      const evenCard = document.getElementById("02-average-rhythm-even-card");
      const unevenCard = document.getElementById("02-average-rhythm-uneven-card");
      const evenTexture = document.getElementById("02-average-rhythm-even-marks");
      const unevenTexture = document.getElementById("02-average-rhythm-uneven-marks");
      const equalBadge = document.getElementById("02-average-rhythm-equal-badge");
      const bunchedBadge = document.getElementById("02-average-rhythm-bunched-badge");
      const cardNames = document.querySelectorAll("[data-02-average-rhythm-card-name]");
      const countBadges = document.querySelectorAll("[data-02-average-rhythm-count]");

      const titleStates = [
        { t: 0, text: "same count", color: "#f0f0f0" },
        { t: 6.72, text: "different feel", color: "#ff6b1a" },
      ];

      function titleStateAt(time) {
        for (let index = titleStates.length - 1; index >= 0; index -= 1) {
          if (time >= titleStates[index].t) return titleStates[index];
        }
        return titleStates[0];
      }

      const titleDriver = { t: 0 };
      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines["02-average-rhythm"] = tl;

      tl.to(
        titleDriver,
        {
          t: 8.32,
          duration: 8.32,
          ease: "none",
          onUpdate: () => {
            const state = titleStateAt(titleDriver.t);
            title.textContent = state.text;
            title.style.color = state.color;
          },
        },
        0,
      );

      tl.fromTo(
        titleWrap,
        { y: -150, opacity: 0 },
        { y: 0, opacity: 1, duration: 1.2, ease: "power3.out" },
        0.04,
      );

      tl.fromTo(
        rulerLine,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 1.05, ease: "power3.out" },
        0.34,
      );

      tl.fromTo(
        evenCard,
        { x: -360, rotateY: 24, opacity: 0 },
        { x: 0, rotateY: 14, opacity: 1, duration: 1.05, ease: "power3.out" },
        1.9,
      );

      tl.fromTo(
        unevenCard,
        { x: 360, rotateY: -24, opacity: 0 },
        { x: 0, rotateY: -14, opacity: 1, duration: 1.05, ease: "power3.out" },
        2.12,
      );

      tl.fromTo(
        cardNames,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, stagger: 0.22, ease: "power2.out" },
        2.4,
      );

      tl.fromTo(
        countBadges,
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.52, stagger: 0.22, ease: "power2.out" },
        2.58,
      );

      tl.fromTo(
        evenTexture,
        { clipPath: "inset(0 100% 0 0)", opacity: 0 },
        { clipPath: "inset(0 0% 0 0)", opacity: 1, duration: 1.25, ease: "power2.out" },
        2.82,
      );

      tl.fromTo(
        unevenTexture,
        { clipPath: "inset(0 0 0 100%)", opacity: 0 },
        { clipPath: "inset(0 0 0 0%)", opacity: 1, duration: 1.25, ease: "power2.out" },
        3.68,
      );

      tl.to(evenCard, { y: -5, duration: 0.7, ease: "sine.inOut" }, 4.45);
      tl.to(unevenCard, { y: 5, duration: 0.7, ease: "sine.inOut" }, 4.45);
      tl.to(evenCard, { y: 0, duration: 0.7, ease: "sine.inOut" }, 5.15);
      tl.to(unevenCard, { y: 0, duration: 0.7, ease: "sine.inOut" }, 5.15);

      tl.fromTo(
        equalBadge,
        { scale: 0, y: 10, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        5.88,
      );

      tl.fromTo(
        bunchedBadge,
        { scale: 0, y: 10, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        6.3,
      );
    })();
  </script>
