  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="03-clean-cadence"]');
      const anchor = root.querySelector('[data-part="03-clean-cadence-anchor"]');
      const kicker = root.querySelector('[data-part="03-clean-cadence-kicker"]');
      const topRule = root.querySelector('[data-part="03-clean-cadence-top-rule"]');
      const rulerPath = root.querySelector('[id="03-clean-cadence-ruler-line"]');
      const gatePaths = Array.from(root.querySelectorAll("[data-gate-line]"));
      const tiles = Array.from(root.querySelectorAll("[data-gate-tile]"));
      const labels = Array.from(root.querySelectorAll("[data-gate-label]"));
      const endcaps = Array.from(root.querySelectorAll('[data-part="03-clean-cadence-endcap"]'));

      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-clean-cadence"] = timeline;

      [rulerPath, ...gatePaths].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const cadenceStates = [
        { t: 0, count: 0 },
        { t: 0.12, count: 1 },
        { t: 0.88, count: 2 },
        { t: 1.64, count: 3 },
        { t: 2.4, count: 4 },
        { t: 3.16, count: 5 },
        { t: 3.92, count: 6 },
      ];

      function cadenceAt(time) {
        for (let index = cadenceStates.length - 1; index >= 0; index -= 1) {
          if (time >= cadenceStates[index].t) return cadenceStates[index];
        }
        return cadenceStates[0];
      }

      function applyCadence(time) {
        const state = cadenceAt(time);
        const finished = time >= 4.6;

        tiles.forEach((tile, index) => {
          const visible = index < state.count;
          const current = index === state.count - 1;
          tile.style.opacity = visible ? "1" : "0";
          tile.style.transform = visible ? "translateY(0)" : "translateY(-12px)";
          tile.style.backgroundColor = finished || current ? "#ff6b1a" : "rgba(255, 107, 26, 0.42)";
        });

        gatePaths.forEach((path, index) => {
          const active = index < state.count;
          path.style.stroke = finished ? "#ff6b1a" : active ? "#ff6b1a" : "#282726";
          path.style.strokeWidth = finished || active ? "2" : "1";
        });

        labels.forEach((label, index) => {
          const active = index < state.count;
          label.style.color = finished ? "#f0f0f0" : active ? "#ff6b1a" : "#504b48";
          label.style.opacity = finished ? "1" : active ? "1" : "0.42";
        });

        rulerPath.style.stroke = finished ? "#f0f0f0" : "#504b48";
        rulerPath.style.strokeWidth = finished ? "3" : "2";
        endcaps.forEach((endcap) => {
          endcap.style.backgroundColor = finished ? "#f0f0f0" : "#504b48";
        });
      }

      applyCadence(0);

      timeline.fromTo(
        anchor,
        { opacity: 0, y: 28, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.48, ease: "power3.out" },
        0.02,
      );
      timeline.fromTo(
        kicker,
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" },
        0.18,
      );
      timeline.fromTo(
        topRule,
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out" },
        0.2,
      );

      timeline.to(
        rulerPath,
        { strokeDashoffset: 0, duration: 1.55, ease: "power2.out" },
        0.55,
      );
      gatePaths.forEach((path, index) => {
        timeline.to(
          path,
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          0.55 + index * 0.3,
        );
      });

      const cadenceDriver = { t: 0 };
      timeline.to(
        cadenceDriver,
        {
          t: 6.381,
          duration: 6.381,
          ease: "none",
          onUpdate: () => applyCadence(cadenceDriver.t),
        },
        2.6,
      );
    })();
