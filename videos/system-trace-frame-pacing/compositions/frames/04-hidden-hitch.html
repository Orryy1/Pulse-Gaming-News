  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="04-hidden-hitch"]');
      if (!root || typeof gsap === "undefined") return;

      const byId = (id) => Array.from(root.querySelectorAll("[id]")).find((node) => node.id === id);
      const world = byId("04-hidden-hitch-world");
      const scene = root.querySelector('[class~="04-hidden-hitch-scene"]');
      const spikePoint = byId("04-hidden-hitch-spike-point");
      const blurNode = byId("04-hidden-hitch-streak-blur");
      const average = byId("04-hidden-hitch-average");
      const averageValue = byId("04-hidden-hitch-average-value");

      root.querySelectorAll("[data-draw]").forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const cam = { scale: 1, x: 0, y: 0 };
      const drift = { p: 0 };
      const applyCamera = () => {
        const dx = Math.sin(drift.p) * 4;
        const dy = Math.sin(drift.p * 1.31) * 2;
        world.style.transform = `translate(${cam.x + dx}px, ${cam.y + dy}px) scale(${cam.scale})`;
      };

      applyCamera();
      const sceneRect = scene.getBoundingClientRect();
      const spikeRect = spikePoint.getBoundingClientRect();
      const spikeOffsetX = spikeRect.left + spikeRect.width / 2 - (sceneRect.left + sceneRect.width / 2);
      const spikeOffsetY = spikeRect.top + spikeRect.height / 2 - (sceneRect.top + sceneRect.height / 2);
      const focusScale = 1.18;
      const focusX = -spikeOffsetX * focusScale;
      const focusY = -spikeOffsetY * focusScale;

      cam.scale = 0.96;
      cam.x = 36;
      cam.y = 0;
      applyCamera();

      const blurProxy = { v: 20 };
      const writeBlur = () => blurNode.setAttribute("stdDeviation", `0 ${blurProxy.v}`);
      writeBlur();

      const countState = { value: 0 };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        root.querySelector('[class~="04-hidden-hitch-chrome"]'),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.05,
      );
      tl.to(
        byId("04-hidden-hitch-target-line"),
        { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" },
        0.05,
      );

      ["04-hidden-hitch-steady-1", "04-hidden-hitch-steady-2", "04-hidden-hitch-steady-3"].forEach(
        (id, index) => {
          tl.to(
            byId(id),
            { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
            0.22 + index * 0.46,
          );
        },
      );

      tl.fromTo(
        root.querySelectorAll('[class~="04-hidden-hitch-pre-point"]'),
        { opacity: 0, scale: 0.45, transformOrigin: "center center" },
        { opacity: 0.82, scale: 1, duration: 0.22, stagger: 0.13, ease: "power2.out" },
        0.3,
      );

      tl.fromTo(
        average,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" },
        0.12,
      );
      tl.to(
        countState,
        {
          value: 60,
          duration: 1.62,
          ease: "power3.out",
          onUpdate: () => {
            averageValue.textContent = Math.round(countState.value).toString();
          },
        },
        0.22,
      );
      tl.fromTo(
        averageValue,
        { scale: 0.52 },
        { scale: 1, duration: 1.62, ease: "power3.out" },
        0.22,
      );
      tl.fromTo(
        byId("04-hidden-hitch-target-label"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" },
        1.18,
      );

      tl.to(
        cam,
        {
          scale: focusScale,
          x: focusX,
          y: focusY,
          duration: 1.25,
          ease: "power3.inOut",
          onUpdate: applyCamera,
        },
        2.3,
      );

      tl.to(
        byId("04-hidden-hitch-spike-up"),
        { strokeDashoffset: 0, duration: 0.58, ease: "power4.out" },
        2.68,
      );
      tl.fromTo(
        spikePoint,
        { y: 275, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power4.out" },
        2.68,
      );
      tl.to(
        blurProxy,
        { v: 0, duration: 0.58, ease: "power4.out", onUpdate: writeBlur },
        2.68,
      );
      tl.to(
        byId("04-hidden-hitch-spike-down"),
        { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
        3.18,
      );
      tl.fromTo(
        byId("04-hidden-hitch-spike-label"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" },
        3.24,
      );
      tl.fromTo(
        byId("04-hidden-hitch-hitch-gap"),
        { opacity: 0, scaleY: 0.08 },
        { opacity: 0.1, scaleY: 1, duration: 0.56, ease: "power2.out" },
        3.58,
      );
      tl.to(
        byId("04-hidden-hitch-gap-guide"),
        { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
        4.08,
      );

      tl.to(
        cam,
        {
          scale: 0.98,
          x: 0,
          y: 0,
          duration: 1.28,
          ease: "power2.inOut",
          onUpdate: applyCamera,
        },
        6.3,
      );
      tl.to(
        byId("04-hidden-hitch-recovery-1"),
        { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
        6.32,
      );
      tl.to(
        byId("04-hidden-hitch-recovery-2"),
        { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
        6.76,
      );
      tl.fromTo(
        root.querySelectorAll('[class~="04-hidden-hitch-post-point"]'),
        { opacity: 0, scale: 0.42, transformOrigin: "center center" },
        { opacity: 1, scale: 1, duration: 0.2, stagger: 0.065, ease: "power2.out" },
        6.38,
      );
      tl.to(average, { scale: 1.045, duration: 0.24, ease: "power2.out" }, 6.72);
      tl.to(average, { scale: 1, duration: 0.46, ease: "power2.inOut" }, 6.96);
      tl.to(
        byId("04-hidden-hitch-marker-ring"),
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        7.28,
      );

      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1.35,
          duration: 8.64,
          ease: "none",
          onUpdate: applyCamera,
        },
        0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-hidden-hitch"] = tl;
    })();
  </script>
