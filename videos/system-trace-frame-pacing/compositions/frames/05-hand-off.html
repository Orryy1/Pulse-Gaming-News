    (() => {
      const root = document.getElementById("root");
      const world = document.getElementById("05-hand-off-world");
      const engineStation = document.getElementById("05-hand-off-engine-station");
      const driverStation = document.getElementById("05-hand-off-driver-station");
      const displayStation = document.getElementById("05-hand-off-display-station");
      const stations = [engineStation, driverStation, displayStation];
      const engineLabel = document.getElementById("05-hand-off-engine-label");
      const driverLabel = document.getElementById("05-hand-off-driver-label");
      const displayLabel = document.getElementById("05-hand-off-display-label");
      const engineRule = document.getElementById("05-hand-off-engine-rule");
      const driverRule = document.getElementById("05-hand-off-driver-rule");
      const displayRule = document.getElementById("05-hand-off-display-rule");
      const engineGate = document.getElementById("05-hand-off-engine-gate-core");
      const driverGate = document.getElementById("05-hand-off-driver-gate-core");
      const displayGate = document.getElementById("05-hand-off-display-gate-core");
      const railOne = document.getElementById("05-hand-off-rail-segment-one");
      const railTwo = document.getElementById("05-hand-off-rail-segment-two");
      const tile = document.getElementById("05-hand-off-frame-tile");
      const tileLayers = tile.querySelectorAll("[data-05-hand-off-tile-layer]");
      const tileLabel = document.getElementById("05-hand-off-tile-label");
      const queueTick = document.getElementById("05-hand-off-driver-queue");
      const displayCell = document.getElementById("05-hand-off-display-cell");
      const scanLine = document.getElementById("05-hand-off-scan-line");
      const steadyTiles = document.querySelectorAll("[data-05-hand-off-steady-tile]");

      [railOne, railTwo].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const viewportHeight = root.clientHeight;

      function stationCentreY(station) {
        return station.offsetTop + station.offsetHeight / 2;
      }

      function cameraYFor(station, scale, targetScreenY = viewportHeight / 2) {
        const offsetFromCentre = stationCentreY(station) - viewportHeight / 2;
        return targetScreenY - viewportHeight / 2 - offsetFromCentre * scale;
      }

      const engineCentre = stationCentreY(engineStation);
      const driverCentre = stationCentreY(driverStation);
      const displayCentre = stationCentreY(displayStation);
      const driverDeltaY = driverCentre - engineCentre;
      const displayDeltaY = displayCentre - engineCentre;
      const displayDeltaX = -176;

      const cam = {
        scale: 1.18,
        x: 0,
        y: cameraYFor(engineStation, 1.18),
      };

      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }

      applyCamera();

      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines["05-hand-off"] = tl;

      tileLayers.forEach((layer, index) => {
        tl.fromTo(
          layer,
          {
            x: -22 + index * 9,
            y: -22 + index * 9,
            scale: 0.72 + index * 0.1,
            opacity: 0,
          },
          {
            x: 0,
            y: 0,
            scale: 1,
            opacity: 1,
            duration: 0.52,
            ease: "power3.out",
          },
          0.08 + index * 0.1,
        );
      });

      tl.fromTo(
        engineLabel,
        { y: 26, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        0.74,
      );
      tl.fromTo(
        engineRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: "power2.out" },
        0.86,
      );
      tl.fromTo(
        engineGate,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        0.66,
      );
      tl.fromTo(
        tileLabel,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.42, ease: "power2.out" },
        0.92,
      );
      tl.to(
        railOne,
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
        1.32,
      );

      tl.to(
        cam,
        {
          scale: 1.08,
          y: cameraYFor(driverStation, 1.08),
          duration: 1.2,
          ease: "power3.inOut",
          onUpdate: applyCamera,
        },
        2.6,
      );
      tl.to(
        tile,
        { y: driverDeltaY, duration: 1.18, ease: "power2.inOut" },
        2.76,
      );
      tl.to(engineStation, { opacity: 0.24, duration: 0.62, ease: "power1.out" }, 2.78);
      tl.to(driverStation, { opacity: 1, duration: 0.62, ease: "power1.out" }, 3.42);
      tl.fromTo(
        driverLabel,
        { y: 26, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        3.48,
      );
      tl.fromTo(
        driverRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: "power2.out" },
        3.6,
      );
      tl.fromTo(
        driverGate,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        3.72,
      );
      tl.fromTo(
        queueTick,
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
        3.94,
      );
      tl.to(queueTick, { opacity: 0.24, duration: 0.38, ease: "power1.out" }, 4.42);

      tl.to(
        tile,
        { y: displayDeltaY, duration: 1.14, ease: "power2.inOut" },
        5.46,
      );
      tl.to(
        railTwo,
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
        5.54,
      );
      tl.to(
        cam,
        {
          scale: 0.62,
          y: cameraYFor(displayStation, 0.62, viewportHeight * 0.675),
          duration: 1.05,
          ease: "power3.inOut",
          onUpdate: applyCamera,
        },
        5.8,
      );
      tl.to(driverStation, { opacity: 0.26, duration: 0.58, ease: "power1.out" }, 5.86);
      tl.to(displayStation, { opacity: 1, duration: 0.62, ease: "power1.out" }, 6.12);
      tl.fromTo(
        displayLabel,
        { y: 26, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        6.18,
      );
      tl.fromTo(
        displayRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: "power2.out" },
        6.28,
      );
      tl.fromTo(
        displayGate,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        6.34,
      );
      tl.to(tile, { x: displayDeltaX, scale: 0.72, duration: 0.42, ease: "power2.inOut" }, 6.52);
      tl.fromTo(
        displayCell,
        { scale: 0.72, opacity: 0.16 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        6.72,
      );
      tl.fromTo(
        scanLine,
        { x: 0, opacity: 0 },
        { x: 365, opacity: 1, duration: 0.62, ease: "none" },
        7.12,
      );
      tl.to(scanLine, { opacity: 0.22, duration: 0.28, ease: "power1.out" }, 7.74);

      tl.to(
        cam,
        {
          scale: 0.56,
          y: cameraYFor(driverStation, 0.56),
          duration: 0.86,
          ease: "power3.inOut",
          onUpdate: applyCamera,
        },
        8.2,
      );
      tl.to(stations, { opacity: 0.72, duration: 0.68, ease: "power1.out" }, 8.2);
      tl.to(tile, { opacity: 0.28, duration: 0.52, ease: "power1.out" }, 8.2);
      tl.fromTo(
        steadyTiles,
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
        8.28,
      );
      tl.to(

        { y: 269, duration: 1.1, ease: "none" },

      );
    })();
