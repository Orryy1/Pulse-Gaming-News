  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameId = "02-display-clock";
      const duration = 8.2;
      const root = document.getElementById("root");
      const world = document.getElementById("f02-display-clock-world");
      const titleWords = Array.from(document.getElementById("f02-display-clock-title").querySelectorAll("span"));
      const tickLines = Array.from(document.getElementsByClassName("f02-display-clock-tick"));
      const rail = document.getElementById("f02-display-clock-rail");
      const marker = document.getElementById("f02-display-clock-marker");
      const pass = document.getElementById("f02-display-clock-pass");
      const fixed = document.getElementById("f02-display-clock-fixed");
      const tag = document.getElementById("f02-display-clock-tag");
      const cam = { scale: 1, y: 0 };

      function applyCamera() {
        world.style.transform = `translate(0px, ${cam.y}px) scale(${cam.scale})`;
      }

      applyCamera();
      const railLength = rail.getTotalLength();
      rail.style.strokeDasharray = `${railLength}`;
      rail.style.strokeDashoffset = `${railLength}`;

      const tl = gsap.timeline({ paused: true });
      tl.set([titleWords, document.getElementById("f02-display-clock-kicker"), document.getElementById("f02-display-clock-count")], { opacity: 0 })
        .set(document.getElementById("f02-display-clock-rule"), { scaleX: 0 })
        .set(tickLines, { opacity: 0, scaleX: 0 })
        .set([marker, pass, fixed, tag, document.getElementsByClassName("f02-display-clock-top")[0], document.getElementsByClassName("f02-display-clock-bottom")[0]], { opacity: 0 });

      tl.fromTo(document.getElementById("f02-display-clock-kicker"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.08)
        .fromTo(titleWords[0], { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.32)
        .fromTo(titleWords[1], { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.88)
        .fromTo(document.getElementById("f02-display-clock-count"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.3)
        .to(document.getElementById("f02-display-clock-rule"), { scaleX: 1, duration: 0.48, ease: "power3.out" }, 1.55);

      tl.to(rail, { strokeDashoffset: 0, duration: 1.25, ease: "power2.out" }, 2.5)
        .to(tickLines, { opacity: 1, scaleX: 1, duration: 0.4, stagger: 0.18, ease: "power3.out" }, 2.82)
        .fromTo([document.getElementsByClassName("f02-display-clock-top")[0], document.getElementsByClassName("f02-display-clock-bottom")[0]], { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.22, ease: "power3.out" }, 3.05)
        .fromTo(marker, { opacity: 0, y: 0 }, { opacity: 1, y: 460, duration: 1.85, ease: "none" }, 3.55)
        .to(cam, { scale: 1.045, y: -20, duration: 1.85, ease: "power3.out", onUpdate: applyCamera }, 3.55);

      tl.fromTo(pass, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.55)
        .fromTo(marker, { opacity: 0, y: 0 }, { opacity: 1, y: 460, duration: 1.15, ease: "none" }, 5.8)
        .to(cam, { scale: 1.025, y: -8, duration: 1.25, ease: "power3.out", onUpdate: applyCamera }, 5.8)
        .fromTo(fixed, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 6.85)
        .fromTo(tag, { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power1.out" }, 7.25);

      tl.to(root, { duration: duration, opacity: 1, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
  </script>
