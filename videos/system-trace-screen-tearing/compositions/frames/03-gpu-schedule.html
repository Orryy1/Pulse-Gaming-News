  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const id = "f03-gpu-schedule";
      const root = document.getElementById("root");
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-gpu-schedule"] = tl;

      const wordItems = [
        { target: root.querySelector(".f03-gpu-schedule-title-word:nth-child(1)"), chars: 3 },
        { target: root.querySelector(".f03-gpu-schedule-title-word:nth-child(2)"), chars: 8 }
      ];
      let wordCursor = 0;
      const wordTimeline = wordItems.map((item) => {
        const duration = 0.28 + item.chars * 0.035;
        const start = wordCursor;
        wordCursor += duration + 0.08;
        return { ...item, start, duration };
      });

      wordTimeline.forEach((item) => {
        tl.fromTo(item.target, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: item.duration, ease: "power3.out" }, item.start);
      });
      tl.fromTo(root.querySelector(".f03-gpu-schedule-kicker"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.12);
      tl.fromTo(root.querySelector(".f03-gpu-schedule-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(root.querySelector(".f03-gpu-schedule-rail"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 1.0);
      tl.fromTo(root.querySelectorAll(".f03-gpu-schedule-tick"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.14 }, 1.4);
      tl.fromTo(root.querySelector(".f03-gpu-schedule-rail-note"), { opacity: 0, y: 9 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.68);

      const arrivals = [
        { card: ".f03-gpu-schedule-card-a", gap: ".f03-gpu-schedule-gap-a", label: ".f03-gpu-schedule-gap-label-a", start: 2.7 },
        { card: ".f03-gpu-schedule-card-b", gap: ".f03-gpu-schedule-gap-a", label: ".f03-gpu-schedule-gap-label-a", start: 3.8 },
        { card: ".f03-gpu-schedule-card-c", gap: ".f03-gpu-schedule-gap-b", label: ".f03-gpu-schedule-gap-label-b", start: 5.25 }
      ];
      arrivals.forEach((arrival, index) => {
        const card = root.querySelector(arrival.card);
        const fill = card.querySelector(".f03-gpu-schedule-card-fill");
        tl.fromTo(card, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" }, arrival.start);
        tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 0.62, ease: "power3.out" }, arrival.start + 0.16);
        if (index === 0 || index === 2) {
          tl.fromTo(root.querySelector(arrival.gap), { scaleX: 0 }, { scaleX: 1, duration: 0.62, ease: "power3.out" }, arrival.start + 0.32);
          tl.fromTo(root.querySelector(arrival.label), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, arrival.start + 0.55);
        }
      });

      const timings = {
        complex: { start: 0.14, end: 0.65 },
        scene: { start: 0.78, end: 1.74 }
      };
      const words = root.querySelectorAll(".f03-gpu-schedule-word");
      const driver = { t: 0 };
      const attack = 0.16;
      const release = 0.36;
      const rest = 0.16;
      const envelope = (time, start, end) => {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        const releaseEnd = end + release;
        if (time < releaseEnd) return 1 - ((time - end) / release) * (1 - rest);
        return rest;
      };
      tl.fromTo(root.querySelector(".f03-gpu-schedule-complexity"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.14);
      tl.to(driver, {
        t: 2.2,
        duration: 2.2,
        ease: "none",
        onUpdate: () => {
          words.forEach((word) => {
            const timing = timings[word.dataset.word];
            const strength = envelope(driver.t, timing.start, timing.end);
            word.style.color = strength > 0.52 ? "#F0F0F0" : "#504B48";
            word.style.textShadow = `0 0 ${30 * strength}px rgba(255, 107, 26, ${0.76 * strength})`;
            word.style.transform = `scale(${1 + 0.16 * strength})`;
          });
        }
      }, 6.2);
    })();
  </script>
