        <div class="frame-04-split-point-region-label frame-04-split-point-region-label--lower" id="frame-04-split-point-lower"><span class="frame-04-split-point-region-rule"></span>LOWER / FRAME B</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const shellPaths = [
        document.getElementById("frame-04-split-point-shell-path"),
        document.getElementById("frame-04-split-point-divider-path"),
      ];
      shellPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const world = document.getElementById("frame-04-split-point-world");
      const cam = { scale: 1, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }
      applyCamera();

      const upperWords = Array.from(document.querySelectorAll(".frame-04-split-point-title-word"));
      const frameAItems = [
        { element: upperWords[0], body: "frame", hold: 0.28 },
        { element: upperWords[1], body: "a", hold: 0.56 },
      ];
      let frameACursor = 0.36;
      const frameATimeline = frameAItems.map((item) => {
        const duration = 0.42 + item.body.length * 0.045 + item.hold;
        const entry = { ...item, start: frameACursor, end: frameACursor + duration };
        frameACursor = entry.end;
        return entry;
      });

      const labelItems = [
        { element: document.getElementById("frame-04-split-point-upper"), body: "upper", hold: 0.34 },
        { element: document.getElementById("frame-04-split-point-lower"), body: "lower", hold: 0.62 },
      ];
      let labelCursor = 6.44;
      const labelTimeline = labelItems.map((item) => {
        const duration = 0.46 + item.body.length * 0.045 + item.hold;
        const entry = { ...item, start: labelCursor, end: labelCursor + duration };
        labelCursor = entry.end;
        return entry;
      });

      tl.fromTo(".frame-04-split-point-kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.04);
      tl.fromTo(".frame-04-split-point-meta", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.16);
      tl.to(shellPaths[0], { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, 0.12);
      tl.to(shellPaths[1], { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" }, 0.98);
      frameATimeline.forEach((item) => {
        tl.fromTo(item.element, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, item.start);
      });
      tl.fromTo(".frame-04-split-point-frame-a", { opacity: 0 }, { opacity: 1, duration: 0.52, ease: "power1.out" }, 0.5);
      tl.fromTo(".frame-04-split-point-scan-line", { opacity: 0, y: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.38, ease: "power2.out" }, 2.86);
      tl.to(".frame-04-split-point-scan-line", { y: 408, duration: 2.42, ease: "power3.inOut" }, 2.96);

      const buffer = document.getElementById("frame-04-split-point-buffer");
      const asrWords = Array.from(buffer.querySelectorAll(".frame-04-split-point-buffer-word"));
      const timings = { buffer: { start: 0.22, end: 0.80 }, change: { start: 0.98, end: 1.78 } };
      const glowDriver = { t: 0 };
      function envelope(time, start, end) {
        const attack = 0.16;
        const release = 0.34;
        const rest = 0.12;
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        if (time < end + release) return 1 - ((time - end) / release) * (1 - rest);
        return rest;
      }
      tl.fromTo(buffer, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 3.02);
      tl.to(glowDriver, {
        t: 3.4,
        duration: 3.4,
        ease: "none",
        onUpdate: () => {
          asrWords.forEach((word) => {
            const timing = timings[word.dataset.word];
            const env = envelope(glowDriver.t, timing.start, timing.end);
            word.style.textShadow = `0 0 ${36 * env}px rgba(255,107,26,${0.85 * env})`;
            word.style.transform = `scale(${1 + 0.18 * env})`;
            word.style.color = word.dataset.word === "change" ? "#FF6B1A" : `rgba(240,240,240,${0.28 + 0.72 * env})`;
          });
        },
      }, 2.8);

      tl.to(cam, {
        scale: 1.07,
        y: 64,
        duration: 1.65,
        ease: "power3.inOut",
        onUpdate: applyCamera,
      }, 3.22);
      tl.set("#frame-04-split-point-frame-b", { opacity: 1 }, 5.34);
      tl.fromTo("#frame-04-split-point-frame-b", { scaleX: 0.82, transformOrigin: "left center" }, { scaleX: 1, duration: 0.36, ease: "power2.out" }, 5.34);

      labelTimeline.forEach((item) => {
        tl.fromTo(item.element, { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, item.start);
      });
      tl.fromTo("#frame-04-split-point-note", { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power1.out" }, 7.62);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-split-point"] = tl;
    })();
  </script>
