  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const id = "f05-two-ways-to-align";
      const root = document.getElementById("root");
      const world = root.querySelector(".f05-two-ways-to-align-world");
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["05-two-ways-to-align"] = tl;

      const vsyncPath = root.querySelector(".f05-two-ways-to-align-vsync-path");
      const vrrPath = root.querySelector(".f05-two-ways-to-align-vrr-path");
      [vsyncPath, vrrPath].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const chrome = root.querySelector(".f05-two-ways-to-align-chrome");
      const kicker = root.querySelector(".f05-two-ways-to-align-kicker");
      const headingLine = root.querySelector(".f05-two-ways-to-align-heading-line");
      const vsyncPanel = root.querySelector(".f05-two-ways-to-align-vsync-panel");
      const vrrPanel = root.querySelector(".f05-two-ways-to-align-vrr-panel");
      const vsyncMarker = vsyncPanel.querySelector(".f05-two-ways-to-align-frame-marker");
      const vsyncGate = vsyncPanel.querySelector(".f05-two-ways-to-align-fixed-gate");

      tl.fromTo(chrome, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(kicker, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.18);
      tl.fromTo(headingLine, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 0.36);
      tl.to(vsyncPath, { strokeDashoffset: 0, duration: 1.55, ease: "power2.out" }, 0.62);
      tl.fromTo(vsyncMarker, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.55);
      tl.fromTo(vsyncGate, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, 2.06);
      tl.fromTo(vsyncPanel.querySelectorAll(".f05-two-ways-to-align-frame-marker-label, .f05-two-ways-to-align-fixed-label"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, 2.36);

      tl.to(vsyncPanel, { rotateY: 10, duration: 0.85, ease: "power3.out" }, 3.0);
      tl.fromTo(vrrPanel, { opacity: 0, x: 82, y: 28, rotateY: -24 }, { opacity: 1, x: 0, y: 0, rotateY: -10, duration: 0.95, ease: "power3.out" }, 3.15);
      tl.to(vrrPath, { strokeDashoffset: 0, duration: 0.82, ease: "power2.out" }, 3.72);
      tl.fromTo(vrrPanel.querySelectorAll(".f05-two-ways-to-align-frame-marker, .f05-two-ways-to-align-frame-marker-label"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.1 }, 4.0);

      const vrrGate = vrrPanel.querySelector(".f05-two-ways-to-align-vrr-gate");
      const vrrMarker = vrrPanel.querySelector(".f05-two-ways-to-align-frame-marker");
      const gateDistance = vrrMarker.offsetLeft - vrrGate.offsetLeft;
      const cam = { scale: 1, x: 0, y: 0 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera();
      tl.fromTo(vrrGate, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.36, ease: "power3.out" }, 4.36);
      tl.to(vrrGate, { x: gateDistance, duration: 1.25, ease: "power3.out" }, 4.62);
      tl.to(cam, { scale: 1.045, y: -28, duration: 1.25, ease: "power3.out", onUpdate: applyCamera }, 4.62);
      tl.fromTo(vrrPanel.querySelector(".f05-two-ways-to-align-fixed-label"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.72);

      const timings = {
        wait: { start: 0.14, end: 0.72 },
        change: { start: 0.95, end: 1.62 }
      };
      const words = root.querySelectorAll(".f05-two-ways-to-align-word");
      const driver = { t: 0 };
      const envelope = (time, start, end) => {
        const attack = 0.16;
        const release = 0.34;
        const rest = 0.16;
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        if (time < end + release) return 1 - ((time - end) / release) * (1 - rest);
        return rest;
      };
      tl.fromTo(root.querySelector(".f05-two-ways-to-align-rule-pair"), { opacity: 0, y: 9 }, { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 6.26);
      tl.to(driver, {
        t: 2.0,
        duration: 2.0,
        ease: "none",
        onUpdate: () => {
          words.forEach((word) => {
            const timing = timings[word.dataset.word];
            const strength = envelope(driver.t, timing.start, timing.end);
            word.style.color = strength > 0.5 ? "#F0F0F0" : "#504B48";
            word.style.textShadow = `0 0 ${30 * strength}px rgba(255, 107, 26, ${0.76 * strength})`;
            word.style.transform = `scale(${1 + 0.08 * strength})`;
          });
        }
      }, 6.34);
    })();
