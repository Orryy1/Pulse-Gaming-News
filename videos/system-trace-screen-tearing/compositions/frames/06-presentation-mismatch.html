    (() => {

      const root = document.getElementById("root");
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["06-presentation-mismatch"] = tl;

      const chrome = root.querySelector(".f06-presentation-mismatch-chrome");
      const kicker = root.querySelector(".f06-presentation-mismatch-kicker");
      const kickerRule = root.querySelector(".f06-presentation-mismatch-kicker-rule");
      const displayPath = root.querySelector(".f06-presentation-mismatch-display-path");
      const gpuPath = root.querySelector(".f06-presentation-mismatch-gpu-path");
      [displayPath, gpuPath].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const displayLabel = root.querySelector(".f06-presentation-mismatch-display-label");
      const gpuLabel = root.querySelector(".f06-presentation-mismatch-gpu-label");
      const seam = root.querySelector(".f06-presentation-mismatch-seam");
      const seamLabel = root.querySelector(".f06-presentation-mismatch-seam-label");
      const zoomOuter = root.querySelector(".f06-presentation-mismatch-zoom-outer");
      const zoomInner = root.querySelector(".f06-presentation-mismatch-zoom-inner");
      const rootRect = root.getBoundingClientRect();
      const seamRect = seam.getBoundingClientRect();
      const seamOffsetX = seamRect.left + seamRect.width / 2 - (rootRect.left + rootRect.width / 2);
      const seamOffsetY = seamRect.top + seamRect.height / 2 - (rootRect.top + rootRect.height / 2);
      const maxScale = Math.min((rootRect.width * 0.88) / seamRect.width, (rootRect.height * 0.88) / seamRect.height);
      const zoomScale = Math.min(1.22, maxScale);

      tl.fromTo(chrome, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(kicker, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.16);
      tl.fromTo(kickerRule, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.34);
      tl.fromTo(displayLabel, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 0.52);
      tl.to(displayPath, { strokeDashoffset: 0, duration: 1.35, ease: "power2.out" }, 0.72);
      tl.fromTo(gpuLabel, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 1.38);
      tl.to(gpuPath, { strokeDashoffset: 0, duration: 1.35, ease: "power2.out" }, 1.55);
      tl.fromTo(seam, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 2.38);
      tl.fromTo(seamLabel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 2.58);

      tl.to(zoomOuter, { scale: zoomScale, duration: 1.45, ease: "power3.inOut" }, 2.9);
      tl.to(zoomInner, { x: -seamOffsetX, y: -seamOffsetY, duration: 1.45, ease: "power3.inOut" }, 2.9);
      tl.to([displayLabel, gpuLabel, seamLabel], { scale: 0.72, opacity: 0, duration: 0.42, ease: "power2.in" }, 4.55);

      const card = root.querySelector(".f06-presentation-mismatch-diagnostic-card");
      const titleWords = [
        { target: root.querySelector(".f06-presentation-mismatch-title-word:nth-child(1)"), chars: 12 },
        { target: root.querySelector(".f06-presentation-mismatch-title-word:nth-child(2)"), chars: 8 }
      ];
      let wordCursor = 5.96;
      const titleTimeline = titleWords.map((item) => {
        const duration = 0.22 + item.chars * 0.027;
        const start = wordCursor;
        wordCursor += duration + 0.11;
        return { ...item, start, duration };
      });
      tl.fromTo(card, { opacity: 0, scale: 0.72 }, { opacity: 1, scale: 1, duration: 0.68, ease: "power3.out" }, 5.76);
      titleTimeline.forEach((item) => {
        tl.fromTo(item.target, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: item.duration, ease: "power3.out" }, item.start);
      });
      tl.fromTo(root.querySelector(".f06-presentation-mismatch-diagnostic-eyebrow"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.82);
      tl.fromTo(root.querySelector(".f06-presentation-mismatch-card-line"), { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 7.04);
      tl.fromTo(root.querySelectorAll(".f06-presentation-mismatch-card-summary, .f06-presentation-mismatch-card-system"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, 7.2);
