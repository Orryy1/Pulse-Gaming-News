  <script>
    (() => {
      const root = document.getElementById("root");
      const gate = document.getElementById("03-missing-pipeline-gate");
      const gateAxis = document.getElementById("03-missing-pipeline-gate-axis");
      const steadyTiles = document.querySelectorAll("[data-03-missing-pipeline-steady-tile]");
      const effectTile = document.getElementById("03-missing-pipeline-effect-tile");
      const recipe = document.getElementById("03-missing-pipeline-recipe");
      const recipeLayers = document.querySelectorAll("[data-03-missing-pipeline-recipe-layer]");
      const recipeStatus = document.getElementById("03-missing-pipeline-recipe-status");
      const seal = document.getElementById("03-missing-pipeline-seal");
      const timer = document.getElementById("03-missing-pipeline-timer");
      const timerValue = document.getElementById("03-missing-pipeline-timer-value");
      const timerFill = document.getElementById("03-missing-pipeline-timer-fill");
      const traceTicks = document.querySelectorAll("[data-03-missing-pipeline-trace-tick]");
      const stretchedSegment = document.getElementById("03-missing-pipeline-stretched-segment");
      const marker = document.getElementById("03-missing-pipeline-marker");

      const steadyTravel = root.clientWidth * 0.52;
      const effectHold = root.clientWidth * 0.72;

      const statusStates = [
        { t: 0, text: "" },
        { t: 3.0, text: "missing" },
        { t: 3.82, text: "building" },
        { t: 7.4, text: "sealed" },
      ];

      function statusAt(time) {
        for (let index = statusStates.length - 1; index >= 0; index -= 1) {
          if (time >= statusStates[index].t) return statusStates[index].text;
        }
        return "";
      }

      const statusDriver = { t: 0 };
      const timerDriver = { value: 16.7 };
      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines["03-missing-pipeline"] = tl;

      tl.to(
        statusDriver,
        {
          t: 8.235,
          duration: 8.235,
          ease: "none",
          onUpdate: () => {
            recipeStatus.textContent = statusAt(statusDriver.t);
          },
        },
        0,
      );

      tl.fromTo(
        gate,
        { y: -130, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.68, ease: "power3.out" },
        0.04,
      );
      tl.fromTo(
        gateAxis,
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.52, ease: "power2.out" },
        0.22,
      );

      const steadySpacing = root.clientWidth * 0.18;
      steadyTiles.forEach((tile, index) => {
        tl.fromTo(
          tile,
          { x: -150, opacity: 0 },
          {
            x: steadyTravel - (steadyTiles.length - 1 - index) * steadySpacing,
            opacity: 1,
            duration: 0.92,
            ease: "power2.inOut",
          },
          0.5 + index * 0.72,
        );
      });

      traceTicks.forEach((tick, index) => {
        if (index > 2) return;
        tl.fromTo(
          tick,
          { scaleY: 0, opacity: 0 },
          { scaleY: 1, opacity: 0.72, duration: 0.3, ease: "power3.out" },
          1.08 + index * 0.72,
        );
      });

      tl.fromTo(
        effectTile,
        { x: effectHold + root.clientWidth * 0.16, opacity: 0 },
        { x: effectHold, opacity: 1, duration: 0.84, ease: "power3.out" },
        3.0,
      );
      tl.fromTo(
        recipe,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        3.08,
      );
      tl.fromTo(
        timer,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.52, ease: "power3.out" },
        3.2,
      );
      tl.fromTo(
        timerFill,
        { scaleX: 0.44 },
        { scaleX: 1, duration: 3.7, ease: "none" },
        3.3,
      );
      tl.to(
        timerDriver,
        {
          value: 38,
          duration: 3.7,
          ease: "none",
          onUpdate: () => {
            timerValue.textContent = timerDriver.value >= 37.95
              ? "38 ms"
              : `${timerDriver.value.toFixed(1)} ms`;
          },
        },
        3.3,
      );
      tl.fromTo(
        stretchedSegment,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 3.7, ease: "none" },
        3.3,
      );

      recipeLayers.forEach((layer, index) => {
        const direction = index % 2 === 0 ? -1 : 1;
        tl.fromTo(
          layer,
          { x: direction * 86, y: 18, opacity: 0 },
          { x: 0, y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
          3.78 + index * 0.82,
        );
      });

      tl.fromTo(
        seal,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.34, ease: "power2.out" },
        7.4,
      );
      tl.to(
        effectTile,
        { x: effectHold, scale: 1.04, duration: 0.42, ease: "power3.out" },
        7.43,
      );

      traceTicks.forEach((tick, index) => {
        if (index < 3) return;
        tl.fromTo(
          tick,
          { scaleY: 0, opacity: 0 },
          { scaleY: 1, opacity: 0.72, duration: 0.26, ease: "power3.out" },
          7.46 + (index - 3) * 0.08,
        );
      });

      tl.fromTo(
        marker,
        { scale: 0.76, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        7.56,
      );
    })();
