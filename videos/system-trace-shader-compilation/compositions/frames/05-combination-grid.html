  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="05-combination-grid"]');
      const countBlock = root.querySelector('[data-part="05-combination-grid-count-block"]');
      const count = root.querySelector('[data-part="05-combination-grid-count"]');
      const prebuild = root.querySelector('[data-part="05-combination-grid-prebuild"]');
      const prebuildLine = root.querySelector('[data-part="05-combination-grid-prebuild-line"]');
      const initialGrid = root.querySelector('[data-part="05-combination-grid-initial"]');
      const initialCells = Array.from(root.querySelectorAll("[data-choice]"));
      const denseGrid = root.querySelector('[data-part="05-combination-grid-dense"]');
      const caveat = root.querySelector('[data-part="05-combination-grid-caveat"]');
      const driverStamp = root.querySelector('[data-part="05-combination-grid-driver-stamp"]');
      const cacheStack = root.querySelector('[data-part="05-combination-grid-cache-stack"]');
      const cacheStrike = root.querySelector('[data-part="05-combination-grid-cache-strike"]');
      const cacheRail = root.querySelector('[data-part="05-combination-grid-cache-rail"]');
      const status = root.querySelector('[data-part="05-combination-grid-status"]');

      const prebuiltIndices = new Set([2, 9, 18, 27, 45, 56]);
      for (let index = 1; index <= 64; index += 1) {
        const cell = document.createElement("span");
        cell.setAttribute("data-matrix-cell", String(index));
        if (prebuiltIndices.has(index)) cell.setAttribute("data-prebuilt", "true");
        denseGrid.appendChild(cell);
      }
      const denseCells = Array.from(denseGrid.querySelectorAll("[data-matrix-cell]"));

      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["05-combination-grid"] = timeline;

      const countStates = [
        { t: 0, text: "4" },
        { t: 3.4, text: "16" },
        { t: 4.5, text: "64" },
        { t: 5.8, text: "100s" },
      ];

      function countAt(time) {
        for (let index = countStates.length - 1; index >= 0; index -= 1) {
          if (time >= countStates[index].t) return countStates[index].text;
        }
        return countStates[0].text;
      }

      const countDriver = { t: 0 };
      count.textContent = countAt(0);
      timeline.to(
        countDriver,
        {
          t: 10.24,
          duration: 10.24,
          ease: "none",
          onUpdate: () => {
            count.textContent = countAt(countDriver.t);
          },
        },
        0,
      );

      timeline.fromTo(
        countBlock,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
        0,
      );
      timeline.fromTo(
        prebuild,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        0.14,
      );

      initialCells.forEach((cell, index) => {
        timeline.fromTo(
          cell,
          { opacity: 0, scale: 0.78 },
          { opacity: 1, scale: 1, duration: 0.44, ease: "power3.out" },
          0.18 + index * 0.34,
        );
      });
      timeline.fromTo(
        prebuildLine,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.72, ease: "power2.out" },
        1.38,
      );
      timeline.to(
        initialCells[0],
        {
          backgroundColor: "#f0f0f0",
          borderColor: "#f0f0f0",
          color: "#0d0d0f",
          duration: 0.2,
          ease: "none",
        },
        1.82,
      );
      timeline.to(
        initialCells[3],
        {
          backgroundColor: "#f0f0f0",
          borderColor: "#f0f0f0",
          color: "#0d0d0f",
          duration: 0.2,
          ease: "none",
        },
        2.38,
      );

      timeline.set(
        denseGrid,
        { opacity: 0, scale: 1.25, filter: "blur(18px)" },
        0,
      );
      timeline.to(
        initialGrid,
        { scale: 0.8, filter: "blur(18px)", duration: 0.2, ease: "power3.in" },
        3.2,
      );
      timeline.to(
        initialGrid,
        { opacity: 0.15, duration: 0.2, ease: "none" },
        3.2,
      );
      timeline.set(initialGrid, { opacity: 0 }, 3.4);
      timeline.set(denseGrid, { opacity: 0.15 }, 3.4);
      timeline.to(
        denseGrid,
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        3.4,
      );

      denseCells.forEach((cell, index) => {
        timeline.fromTo(
          cell,
          { opacity: 0, scale: 0.55 },
          { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" },
          3.46 + index * 0.048,
        );
      });

      timeline.fromTo(
        caveat,
        { opacity: 0, y: 48 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        7,
      );
      timeline.fromTo(
        driverStamp,
        { opacity: 0, scale: 1.16 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        7.18,
      );
      timeline.fromTo(
        cacheRail,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power2.out" },
        7.52,
      );
      timeline.to(
        cacheStack,
        { x: 259, opacity: 0.44, scale: 0.88, duration: 0.58, ease: "power3.inOut" },
        7.62,
      );
      timeline.fromTo(
        cacheStrike,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.36, ease: "power2.out" },
        7.82,
      );
      timeline.fromTo(
        status,
        { opacity: 0, x: 26 },
        { opacity: 1, x: 0, duration: 0.48, ease: "power3.out" },
        8.08,
      );
    })();
  </script>
