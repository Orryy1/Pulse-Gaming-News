        current: root.querySelector('[data-input-port="current"]'),
        motion: root.querySelector('[data-input-port="motion"]'),
        depth: root.querySelector('[data-input-port="depth"]'),
        history: root.querySelector('[data-input-port="history"]'),
      };
      const rails = {
        current: root.querySelector('[data-rail="current"]'),
        motion: root.querySelector('[data-rail="motion"]'),
        depth: root.querySelector('[data-rail="depth"]'),
        history: root.querySelector('[data-rail="history"]'),
      };
      const vectors = Array.from(root.querySelectorAll("[data-vector]"));
      const depthPlanes = Array.from(root.querySelectorAll("[data-depth-plane]"));
      const historyTiles = Array.from(root.querySelectorAll("[data-history-tile]"));

      const timeline = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-four-inputs"] = timeline;

      [...Object.values(rails), ...vectors].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      timeline.fromTo(
        resolver,
        { opacity: 0, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 0.48, ease: "power3.out" },
        0,

      timeline.fromTo(
        evidence.current,
        { opacity: 0, x: -34 },
        { opacity: 1, x: 0, duration: 0.44, ease: "power3.out" },
        0.04,

      timeline.fromTo(
        evidence.motion,
        { opacity: 0, x: 34 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" },
        1.36,

      vectors.forEach((path, index) => {
        timeline.to(
          path,
          { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" },
          1.92 + index * 0.34,

      });

      timeline.to(

      timeline.fromTo(
        evidence.depth,

        3.44,

      const depthPlaneOpacities = [0.42, 0.68, 1];
      depthPlanes.forEach((plane, index) => {
        timeline.fromTo(
          plane,
          { opacity: 0, scaleX: 0.56 },
          {
            opacity: depthPlaneOpacities[index],
            scaleX: 1,
            duration: 0.42,
            ease: "power3.out",

          3.88 + index * 0.34,
        );
      });

      timeline.fromTo(
        evidence.history,
        { opacity: 0, x: 34 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" },
        4.86,
      );
      const historyTileOpacities = [0.38, 0.65, 1];
      historyTiles.forEach((tile, index) => {
        timeline.fromTo(
          tile,
          { opacity: 0, x: 22, scale: 0.9 },
          {
            opacity: historyTileOpacities[index],
            x: 0,
            scale: 1,
            duration: 0.42,
            ease: "power3.out",
          },
          5.18 + index * 0.38,
        );
      });

      const inputOrder = ["current", "motion", "depth", "history"];
      inputOrder.forEach((key, index) => {
        const railAt = 6.5 + index * 0.26;
        timeline.to(
          rails[key],
          { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
          railAt,
        );
        timeline.fromTo(
          questions[key],
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          railAt + 0.2,
        );
        timeline.to(
          ports[key],
          {
            backgroundColor: "#f0f0f0",
            borderColor: "#f0f0f0",
            duration: 0.16,
            ease: "none",
          },
          railAt + 0.5,
        );
      });

      timeline.to(
        resolver,
        {
          backgroundColor: "#ff6b1a",
          borderColor: "#ff6b1a",
          color: "#0d0d0f",
          duration: 0.3,
          ease: "none",
        },
        7.72,

        resolver,
        { scale: 0.985 },
        {
          scale: 1,
          duration: 0.34,
          ease: "power3.out",
          immediateRender: false,
        },
        7.72,
      );

      const holdDriver = { t: 0 };

        holdDriver,
        { t: 1, duration: 1.089, ease: "none" },
