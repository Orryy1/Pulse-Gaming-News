      const tileFaces = selectAll('[class~="03-reproject-history-tile-face"]');
      const tileA = select('[data-03-reproject-history-tile="a"]');

      const depthAxis = select('[class~="03-reproject-history-depth-axis"]');
      const backgroundPlane = select('[class~="03-reproject-history-background-plane"]');
      const foregroundPlane = select('[class~="03-reproject-history-foreground-plane"]');
      const finalRule = select('[class~="03-reproject-history-final-rule"]');
      const finalCopy = select('[class~="03-reproject-history-final-copy"]');

      [pathA, pathB, pathC].forEach((path) => {
        const length = path.getTotalLength();

        path.style.strokeDashoffset = String(length);

      const routes = {
        a: [

          { x: 420, y: 350 },
          { x: 544, y: 391 }

          { x: 300, y: 826 },
          { x: 442, y: 750 },
          { x: 584, y: 761 }
        ]
      };

      const cubicPoint = (route, t) => {
        const inverse = 1 - t;
        return {
          x:
            inverse * inverse * inverse * route[0].x +
            3 * inverse * inverse * t * route[1].x +
            3 * inverse * t * t * route[2].x +
            t * t * t * route[3].x,
          y:
            inverse * inverse * inverse * route[0].y +
            3 * inverse * inverse * t * route[1].y +
            3 * inverse * t * t * route[2].y +
            t * t * t * route[3].y
        };
      };

      const routeKeyframes = (route, duration) => {
        const stops = [0.16, 0.32, 0.5, 0.68, 0.84, 1];
        return stops.map((stop) => {
          const point = cubicPoint(route, stop);
          return {
            x: point.x - route[0].x,
            y: point.y - route[0].y,
            duration: duration / stops.length,
            ease: "none"
          };
        });
      };

      const timeline = gsap.timeline({ paused: true });

      timeline.addLabel("03-reproject-history-scene-1", 0);
      timeline.fromTo(
        currentView,
        { autoAlpha: 0, x: 46, scale: 0.985 },
        { autoAlpha: 1, x: 0, scale: 1, duration: 0.44, ease: "power3.out" },

      timeline.fromTo(
        currentHeader,
        { autoAlpha: 0, y: -18 },
        { autoAlpha: 1, y: 0, duration: 0.34, ease: "power2.out" },

      timeline.fromTo(

        { opacity: 0 },
        { opacity: 1, duration: 0.42, ease: "power1.out" },

      timeline.fromTo(
