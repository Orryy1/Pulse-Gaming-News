  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="04-history-gate"]');
      if (!root || typeof gsap === "undefined") return;

      const byId = (id) => document.getElementById(id);
      const outputGrid = byId("04-history-gate-output-grid");

      for (let index = 0; index < 48; index += 1) {
        const cell = document.createElement("span");
        const usesCurrent = index % 5 === 0 || index % 7 === 0;
        const isQuiet = index === 17 || index === 34;
        cell.className = `04-history-gate-output-cell ${usesCurrent ? "04-history-gate-current-cell" : "04-history-gate-history-cell"}`;
        cell.dataset.source = usesCurrent ? "current" : "history";
        if (isQuiet) cell.dataset.density = "quiet";
        outputGrid.appendChild(cell);
      }

      const keepPanel = byId("04-history-gate-keep-panel");
      const rejectPanel = byId("04-history-gate-reject-panel");
      const keepGate = byId("04-history-gate-keep-gate");
      const rejectGate = byId("04-history-gate-reject-gate");
      const currentOutline = byId("04-history-gate-current-outline");
      const acceptedTile = byId("04-history-gate-accepted-tile");
      const matchMark = byId("04-history-gate-match-mark");
      const matchLabel = byId("04-history-gate-match-label");
      const newRegion = byId("04-history-gate-new-region");
      const staleTile = byId("04-history-gate-stale-tile");
      const foreground = byId("04-history-gate-foreground");
      const rejectSlot = byId("04-history-gate-reject-slot");
      const strike = byId("04-history-gate-strike");
      const output = byId("04-history-gate-output");
      const outputProof = byId("04-history-gate-output-proof");
      const historyCells = root.querySelectorAll('[data-source="history"]');
      const currentCells = root.querySelectorAll('[data-source="current"]');

      const tl = gsap.timeline({ paused: true });

      tl.set(rejectPanel, { opacity: 0 }, 0);
      tl.set([matchMark, matchLabel], { opacity: 0 }, 0);
      tl.set(rejectSlot, { opacity: 0 }, 0);
      tl.set(strike, { scaleX: 0 }, 0);
      tl.set(output, { opacity: 0 }, 0);
      tl.set(outputProof, { opacity: 0 }, 0);
      tl.set([...historyCells, ...currentCells], { opacity: 0, scale: 0.25 }, 0);

      tl.fromTo(
        keepPanel,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        0.05,
      );
      tl.fromTo(
        keepGate,
        { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.44, ease: "power2.out" },
        0.16,
      );
      tl.fromTo(
        currentOutline,
        { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: 0.46, ease: "power3.out" },
        0.28,
      );
      tl.fromTo(
        acceptedTile,
        { opacity: 0, x: -220, scale: 0.84 },
        { opacity: 1, x: 0, scale: 1, duration: 0.78, ease: "power3.out" },
        0.72,
      );
      tl.to(
        acceptedTile,
        { backgroundColor: "#f0f0f0", borderColor: "#ff6b1a", duration: 0.28, ease: "none" },
        1.48,
      );
      tl.fromTo(
        matchMark,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.42, ease: "power2.out" },
        1.78,
      );
      tl.fromTo(
        matchLabel,
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.36, ease: "power2.out" },
        2.08,
      );

      tl.fromTo(
        rejectPanel,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
        2.8,
      );
      tl.fromTo(
        rejectGate,
        { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.42, ease: "power2.out" },
        3.0,
      );
      tl.to(
        foreground,
        { x: -230, duration: 0.72, ease: "power3.inOut" },
        3.35,
      );
      tl.to(
        newRegion,
        { clipPath: "inset(0 0% 0 0)", duration: 0.58, ease: "power2.out" },
        3.48,
      );
      tl.fromTo(
        rejectSlot,
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.36, ease: "power2.out" },
        4.02,
      );
      tl.to(
        staleTile,
        {
          x: 455,
          opacity: 0.34,
          backgroundColor: "#1a1918",
          borderColor: "#504b48",
          duration: 0.74,
          ease: "power3.inOut",
        },
        4.18,
      );
      tl.to(
        strike,
        { scaleX: 1, duration: 0.38, ease: "power2.out" },
        4.86,
      );
      tl.fromTo(
        rejectPanel.querySelector('[class~="04-history-gate-panel-name"]'),
        { color: "#f0f0f0" },
        { color: "#ff6b1a", duration: 0.24, ease: "none", immediateRender: false },
        5.18,
      );

      tl.fromTo(
        output,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.1,
      );
      tl.to(
        acceptedTile,
        { x: 290, y: 592, scale: 0.36, duration: 0.76, ease: "power3.inOut" },
        6.12,
      );
      tl.fromTo(
        currentCells,
        { opacity: 0, scale: 0.25 },
        { opacity: 1, scale: 1, duration: 0.22, stagger: 0.026, ease: "power2.out" },
        6.48,
      );
      tl.fromTo(
        historyCells,
        { opacity: 0, scale: 0.25 },
        { opacity: 1, scale: 1, duration: 0.22, stagger: 0.018, ease: "power2.out" },
        6.72,
      );
      tl.to(
        acceptedTile,
        { opacity: 0, scale: 0.12, duration: 0.3, ease: "power2.in" },
        6.84,
      );
      tl.fromTo(
        outputProof,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        7.18,
      );

      const holdState = { progress: 0 };
      tl.to(holdState, { progress: 1, duration: 8.96, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-history-gate"] = tl;
    })();
  </script>
