    (() => {

      const byId = (id) => document.getElementById(id);
      const presentGrid = byId("06-borrow-past-present-grid");
      const seedIndices = new Set([2, 10, 23, 37, 48, 57]);

          cell.dataset.source = "history";

      }

      const marker = byId("06-borrow-past-marker");
      const process = byId("06-borrow-past-process");
      const pastLayers = root.querySelectorAll('[class~="06-borrow-past-past-layer"]');

      const ruleStub = byId("06-borrow-past-rule-stub");

      const keepRule = byId("06-borrow-past-keep-rule");

        const length = rail.getTotalLength();
        rail.style.strokeDasharray = `${length}`;
        rail.style.strokeDashoffset = `${length}`;
      });

      const tl = gsap.timeline({ paused: true });

      tl.set(ruleCard, { opacity: 0 }, 0);
      tl.set(ruleStub, { scaleX: 0 }, 0);
      tl.set([borrowRule, keepRule], { opacity: 0 }, 0);
      tl.set([...seedCells, ...denseCells, currentOutline], { opacity: 0, scale: 0.28 }, 0);

      tl.fromTo(
        marker,

        process,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
        0.05,

      tl.fromTo(
        presentGrid,
        { opacity: 0, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 0.48, ease: "power3.out" },
        0.16,
      );
      tl.fromTo(
        pastLayers,
        { opacity: 0, x: -28 },
        {
          opacity: (index) => [0.36, 0.62, 1][index],
          x: 0,
          duration: 0.4,
          stagger: 0.14,
          ease: "power3.out",
        },
        0.12,
      );
      tl.fromTo(
        seedCells,
        { opacity: 0, scale: 0.28 },
        { opacity: 0.62, scale: 1, duration: 0.24, stagger: 0.08, ease: "power2.out" },
        0.34,

      tl.fromTo(
        gate,
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" },
        0.46,
      );
      tl.to(inboundRail, { strokeDashoffset: 0, duration: 1.24, ease: "power2.out" }, 0.52);

      const feedTokens = [acceptA, rejectA, acceptB, rejectB];
      feedTokens.forEach((token, index) => {
        const feedAt = 0.68 + index * 0.42;
        tl.fromTo(
          token,
          { opacity: 0, x: -34, scale: 0.78 },
          { opacity: 1, x: 0, scale: 1, duration: 0.3, ease: "power2.out" },
          feedAt,
        );
        tl.to(
          token,
          { x: 430, duration: 1.0, ease: "power2.inOut" },
          feedAt + 0.18,
        );
      });

      tl.to(

      tl.to(outboundRail, { strokeDashoffset: 0, duration: 0.86, ease: "power2.out" }, 3.0);
