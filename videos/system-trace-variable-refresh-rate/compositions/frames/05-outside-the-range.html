    (() => {

      tl.fromTo(".frame-05-outside-the-range-kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.04);

      tl.fromTo(".frame-05-outside-the-range-heading", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" }, 0.12);
      const belowWords = Array.from(document.querySelectorAll("#frame-05-outside-the-range-below-card .frame-05-outside-the-range-title-word"));
      const belowItems = [
        { element: belowWords[0], body: "prior", hold: 0.26 },
        { element: belowWords[1], body: "frame", hold: 0.54 },
      ];
      let belowCursor = 0.58;
      const belowTimeline = belowItems.map((item) => {
        const duration = 0.42 + item.body.length * 0.045 + item.hold;
        const entry = { ...item, start: belowCursor, end: belowCursor + duration };
        belowCursor = entry.end;
        return entry;
      });
      tl.fromTo("#frame-05-outside-the-range-below-card", { opacity: 0, x: -36, rotateY: 14 }, { opacity: 1, x: 0, rotateY: 10, duration: 0.84, ease: "power3.out" }, 0.28);
      belowTimeline.forEach((item) => {
        tl.fromTo(item.element, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, item.start);
      });
      tl.fromTo(".frame-05-outside-the-range-prior-card", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 1.46);
      const stateText = document.getElementById("frame-05-outside-the-range-state-text");
      const cursor = document.getElementById("frame-05-outside-the-range-cursor");
      const sequence = [
        { t: 0, text: "prior" },
        { t: 0.76, text: "prior again" },
      ];
      function textAt(time) {
        for (let i = sequence.length - 1; i >= 0; i--) {
          if (time >= sequence[i].t) return sequence[i].text;
        }
        return "";
      }
      const textDriver = { t: 0 };
      tl.fromTo(".frame-05-outside-the-range-state", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.62);
      tl.to(textDriver, { t: 2.2, duration: 2.2, ease: "none", onUpdate: () => { stateText.textContent = textAt(textDriver.t); } }, 0.62);
      const blink = { p: 0 };
      tl.to(blink, { p: Math.PI * 8, duration: 2.2, ease: "none", onUpdate: () => { cursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0"; } }, 0.62);

      tl.fromTo("#frame-05-outside-the-range-above-card", { opacity: 0, x: 88, rotateY: -22 }, { opacity: 1, x: 0, rotateY: -10, duration: 0.96, ease: "power3.out" }, 2.96);
      tl.fromTo("#frame-05-outside-the-range-above-card .frame-05-outside-the-range-card-title", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.38);
      const gatePaths = [
        document.getElementById("frame-05-outside-the-range-gate-one"),
        document.getElementById("frame-05-outside-the-range-gate-two"),
        document.getElementById("frame-05-outside-the-range-gate-three"),
      ];
      gatePaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });
      tl.to(gatePaths[0], { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 3.52);
      tl.to(gatePaths[1], { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 3.96);
      tl.to(gatePaths[2], { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 4.40);
      tl.fromTo(".frame-05-outside-the-range-fixed-rule", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, 4.76);

      const windowWord = document.querySelector(".frame-05-outside-the-range-window-label");
      const glowDriver = { t: 0 };
      function envelope(time, start, end) {
        const attack = 0.18;
        const release = 0.38;
        const rest = 0.16;
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        if (time < end + release) return 1 - ((time - end) / release) * (1 - rest);
        return rest;
      }
      tl.to(glowDriver, {
        t: 2.8,
        duration: 2.8,
        ease: "none",
        onUpdate: () => {
          const env = envelope(glowDriver.t, 0.38, 1.62);
          windowWord.style.textShadow = `0 0 ${36 * env}px rgba(255,107,26,${0.84 * env})`;
          windowWord.style.transform = `scale(${1 + 0.18 * env})`;
          windowWord.style.color = `rgba(240,240,240,${0.28 + 0.72 * env})`;
        },
      }, 5.9);
      tl.fromTo("#frame-05-outside-the-range-note", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 7.46);
