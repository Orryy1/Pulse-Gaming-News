  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const id = "02-wait-for-refresh";
      const root = document.getElementById("root");
      const world = root.querySelector(".f02-wait-for-refresh-world");
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;

      const chrome = root.querySelector(".f02-wait-for-refresh-chrome");
      const kicker = root.querySelector(".f02-wait-for-refresh-kicker");
      const headingRule = root.querySelector(".f02-wait-for-refresh-heading-rule");
      const rail = root.querySelector(".f02-wait-for-refresh-rail-line");
      const burstItems = root.querySelectorAll(".f02-wait-for-refresh-burst-item");
      const marker = root.querySelector(".f02-wait-for-refresh-marker");
      const targetMarkerX = Number(marker.dataset.targetX);
      const nextGatePath = root.querySelector(".f02-wait-for-refresh-next-gate-path");
      const nextGateLength = nextGatePath.getTotalLength();
      nextGatePath.style.strokeDasharray = `${nextGateLength}`;
      nextGatePath.style.strokeDashoffset = `${nextGateLength}`;

      tl.fromTo(chrome, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(kicker, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.14);
      tl.fromTo(headingRule, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.3);
      tl.fromTo(rail, { scaleX: 0 }, { scaleX: 1, duration: 0.72, ease: "power3.out" }, 0.38);
      burstItems.forEach((item, index) => {
        tl.fromTo(
          item,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          { x: Number(item.dataset.targetX), y: Number(item.dataset.targetY), scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" },
          0.82 + index * 0.07
        );
      });
      tl.fromTo(root.querySelector(".f02-wait-for-refresh-time-ruler"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.22);

      tl.to(nextGatePath, { strokeDashoffset: 0, duration: 0.82, ease: "power2.out" }, 3.24);
      tl.fromTo(root.querySelector(".f02-wait-for-refresh-next-gate-label"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 3.8);

      const cam = { scale: 1, x: 0, y: 0 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera();
      tl.to(marker, { x: targetMarkerX + 235, duration: 1.0, ease: "power3.out" }, 6.16);
      tl.to(cam, { scale: 1.045, x: -22, y: -18, duration: 1.0, ease: "power3.out", onUpdate: applyCamera }, 6.16);

      const stateEl = root.querySelector(".f02-wait-for-refresh-display-state");
      const statusEl = root.querySelector(".f02-wait-for-refresh-display-status");
      const sequence = [
        { t: 0, text: "frame held", status: "WAIT" },
        { t: 1.18, text: "frame presented", status: "PRESENT" }
      ];
      const stateAt = (time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index];
        }
        return sequence[0];
      };
      const driver = { t: 0 };
      let lastText = "";
      tl.to(driver, {
        t: 3,
        duration: 3,
        ease: "none",
        onUpdate: () => {
          const state = stateAt(driver.t);
          if (state.text !== lastText) {
            stateEl.textContent = state.text;
            statusEl.textContent = state.status;
            lastText = state.text;
          }
        }
      }, 6.0);
      tl.fromTo(root.querySelector(".f02-wait-for-refresh-display-card"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.38);
    })();
  </script>
