  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const gatePaths = [
        document.getElementById("frame-03-missed-gate-track-line"),
        document.getElementById("frame-03-missed-gate-gate-one"),
        document.getElementById("frame-03-missed-gate-gate-two"),
      ];
      gatePaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      tl.fromTo(".frame-03-missed-gate-kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.04);
      tl.fromTo(".frame-03-missed-gate-meta", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power1.out" }, 0.16);
      tl.to(gatePaths[0], { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.18);
      tl.to(gatePaths[1], { strokeDashoffset: 0, duration: 0.78, ease: "power2.out" }, 0.5);
      tl.to(gatePaths[2], { strokeDashoffset: 0, duration: 0.78, ease: "power2.out" }, 1.08);
      tl.fromTo(".frame-03-missed-gate-gate-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out", stagger: 0.16 }, 1.42);
      tl.fromTo(".frame-03-missed-gate-empty", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.72);
      tl.fromTo("#frame-03-missed-gate-old-card", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" }, 1.92);

      const burstItems = Array.from(document.querySelectorAll(".frame-03-missed-gate-burst-item"));
      burstItems.forEach((element, index) => {
        tl.fromTo(element,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          { x: Number(element.dataset.targetX), y: Number(element.dataset.targetY), scale: 1, opacity: 1, duration: 1.34, ease: "power3.out" },
          2.82 + index * 0.06,
        );
      });

      const heading = document.getElementById("frame-03-missed-gate-heading");
      const glowWords = Array.from(heading.querySelectorAll(".frame-03-missed-gate-heading-word"));
      const timings = { missed: { start: 0.26, end: 0.88 }, the: { start: 1.04, end: 1.30 }, gate: { start: 1.46, end: 2.24 } };
      const glowDriver = { t: 0 };
      function envelope(time, start, end) {
        const attack = 0.16;
        const release = 0.34;
        const rest = 0.13;
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        if (time < end + release) return 1 - ((time - end) / release) * (1 - rest);
        return rest;
      }
      tl.fromTo(heading, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 3.0);
      tl.to(glowDriver, {
        t: 2.8,
        duration: 2.8,
        ease: "none",
        onUpdate: () => {
          glowWords.forEach((word) => {
            const timing = timings[word.dataset.word];
            const env = envelope(glowDriver.t, timing.start, timing.end);
            word.style.textShadow = `0 0 ${34 * env}px rgba(255,107,26,${0.82 * env})`;
            word.style.transform = `scale(${1 + 0.18 * env})`;
            word.style.color = word.dataset.word === "gate" ? "#FF6B1A" : `rgba(240,240,240,${0.26 + 0.74 * env})`;
          });
        },
      }, 2.7);

      const statusText = document.getElementById("frame-03-missed-gate-status-text");
      const cursor = document.getElementById("frame-03-missed-gate-cursor");
      const sequence = [
        { t: 0, text: "old image" },
        { t: 1.1, text: "new image" },
      ];
      function textAt(time) {
        for (let i = sequence.length - 1; i >= 0; i--) {
          if (time >= sequence[i].t) return sequence[i].text;
        }
        return "";
      }
      const textDriver = { t: 0 };
      tl.fromTo("#frame-03-missed-gate-status", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 5.56);
      tl.to(textDriver, {
        t: 3,
        duration: 3,
        ease: "none",
        onUpdate: () => { statusText.textContent = textAt(textDriver.t); },
      }, 5.5);
      const blink = { p: 0 };
      tl.to(blink, {
        p: Math.PI * 12,
        duration: 3,
        ease: "none",
        onUpdate: () => { cursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0"; },
      }, 5.5);
      tl.set("#frame-03-missed-gate-old-card", { opacity: 0 }, 6.6);
      tl.set("#frame-03-missed-gate-new-card", { opacity: 1 }, 6.6);
      tl.fromTo("#frame-03-missed-gate-note", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 7.28);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-missed-gate"] = tl;
    })();
  </script>
