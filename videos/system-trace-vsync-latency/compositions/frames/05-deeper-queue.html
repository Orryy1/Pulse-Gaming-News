  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const railPaths = [
        document.getElementById("frame-05-deeper-queue-rail-main"),
        document.getElementById("frame-05-deeper-queue-rail-one"),
        document.getElementById("frame-05-deeper-queue-rail-two"),
        document.getElementById("frame-05-deeper-queue-rail-three"),
      ];
      railPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });
      const world = document.getElementById("frame-05-deeper-queue-world");
      const cam = { scale: 1, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }
      applyCamera();

      tl.fromTo(".frame-05-deeper-queue-kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.04);
      tl.fromTo(".frame-05-deeper-queue-meta", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power1.out" }, 0.16);
      tl.fromTo(".frame-05-deeper-queue-heading", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" }, 0.12);
      tl.to(railPaths[0], { strokeDashoffset: 0, duration: 1.14, ease: "power2.out" }, 0.22);
      tl.to(railPaths[1], { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" }, 1.0);
      tl.to(railPaths[2], { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" }, 1.38);
      tl.to(railPaths[3], { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" }, 1.76);
      tl.fromTo(".frame-05-deeper-queue-rail-label", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", stagger: 0.14 }, 1.2);

      const cards = Array.from(document.querySelectorAll(".frame-05-deeper-queue-card"));
      cards.forEach((element, index) => {
        tl.fromTo(element,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          { x: Number(element.dataset.targetX), y: Number(element.dataset.targetY), scale: 1, opacity: 1, duration: 1.3, ease: "power3.out" },
          1.08 + index * 0.07,
        );
      });

      tl.fromTo("#frame-05-deeper-queue-fresh", { opacity: 0, x: -74 }, { opacity: 1, x: 0, duration: 0.64, ease: "power3.out" }, 2.88);
      tl.to(cam, { scale: 1.06, x: 14, y: -42, duration: 1.78, ease: "power3.inOut", onUpdate: applyCamera }, 3.08);
      const counter = document.getElementById("frame-05-deeper-queue-age-value");
      const ageState = { value: 0 };
      tl.fromTo("#frame-05-deeper-queue-age", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 3.26);
      tl.to(ageState, { value: 3, duration: 1.48, ease: "power3.out", onUpdate: () => { counter.textContent = Math.round(ageState.value).toLocaleString(); } }, 3.38);
      tl.fromTo(counter, { scale: 0.54 }, { scale: 1, duration: 1.48, ease: "power3.out" }, 3.38);

      tl.fromTo("#frame-05-deeper-queue-meter", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 5.92);
      tl.fromTo(".frame-05-deeper-queue-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.72, ease: "power3.out", stagger: 0.08 }, 6.08);
      tl.fromTo(".frame-05-deeper-queue-progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.96, ease: "power2.out" }, 6.08);
      tl.fromTo("#frame-05-deeper-queue-note", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 7.56);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-deeper-queue"] = tl;
    })();
  </script>
